<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2f7fb5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>KV Island</title>
<style>
:root{
  --ink:#2b2438; --paper:#f8eed6; --paper2:#e9dab6; --sun:#ffc64d; --coral:#ef6a57; --leaf:#74bd5c;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2f7fb5;color:var(--ink);
  font:800 15px/1.2 ui-rounded,"SF Pro Rounded","Nunito","Varela Round","Quicksand",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#o,#vig{pointer-events:none}
#vig{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 46%,rgba(30,24,60,0) 58%,rgba(30,24,60,.26) 100%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
[hidden]{display:none!important}
.ic{width:22px;height:22px;flex:none;display:block;overflow:visible}
b{font-weight:800;font-variant-numeric:tabular-nums}
.ui{transition:opacity .4s}
body.title .ui{opacity:0;pointer-events:none!important}
body.title .ui *{pointer-events:none!important}

/* one building block for the whole interface: inked paper with a hard shadow, which sinks when pressed */
.tile,.key{background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink)}
.key{position:relative;display:grid;place-items:center;transition:transform .09s,box-shadow .09s,background-color .12s}
.key:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}

#hud{position:fixed;top:0;left:0;right:0;display:flex;flex-wrap:wrap;gap:8px 7px;align-items:flex-start;
  padding:calc(8px + var(--sat)) calc(9px + var(--sar)) 0 calc(9px + var(--sal));pointer-events:none}
#hud>*{pointer-events:auto}
.plq{display:flex;height:38px;align-items:stretch;border-radius:12px;overflow:hidden}
.st{display:flex;align-items:center;gap:4px;padding:0 9px 0 7px}
.st+.st{border-left:2px solid rgba(43,36,56,.16)}
.st.low b{color:#c93a2a}
.st.flash{animation:flash .5s}
@keyframes flash{30%{background:var(--coral)}}
#sys{display:flex;gap:7px;margin-left:auto;order:3}
#sys .key{width:42px;height:38px;border-radius:12px}
#bSpeed.off{background:var(--sun)}
#pB{order:2}
@media (max-width:560px){#pB{order:4}}

#toasts{position:fixed;top:calc(62px + var(--sat));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:7px;pointer-events:none}
.toast{display:flex;align-items:center;gap:5px;height:36px;padding:0 12px;border-radius:999px;font-size:17px;
  animation:tin .32s cubic-bezier(.3,1.6,.5,1);transition:opacity .4s,transform .4s}
.toast .ic{width:24px;height:24px}
.toast.out{opacity:0;transform:translateY(-8px)}
@keyframes tin{from{transform:scale(.5) translateY(8px);opacity:0}}
@media (max-width:560px){#toasts{top:calc(106px + var(--sat))}}

#bottom{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:0 calc(8px + var(--sar)) calc(10px + var(--sab)) calc(8px + var(--sal));pointer-events:none}
#bottom>*{pointer-events:auto}
#info{position:relative;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:center;max-width:100%;padding:8px 14px;border-radius:16px;
  animation:tin .22s cubic-bezier(.3,1.4,.5,1)}
#info>span{display:flex;align-items:center;gap:4px}
#info .big{width:32px;height:32px}
#info .x{position:absolute;top:-11px;right:-9px;width:28px;height:28px;border-radius:50%}
#info .x::after{content:"";position:absolute;inset:-9px}
#info .x .ic{width:14px;height:14px}
.bar{display:block;width:50px;height:11px;border-radius:6px;border:2px solid var(--ink);background:var(--paper2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);border-right:2px solid var(--ink);margin-left:-2px}
.act{width:40px;height:34px;border-radius:10px;background:#f6b0a2}
.act.sure{background:var(--coral)}
#toolbar,#buildbar{display:grid;gap:7px;width:100%}
#toolbar{grid-template-columns:repeat(7,1fr);max-width:500px}
#buildbar{grid-template-columns:repeat(8,1fr);max-width:600px}
@media (max-width:560px){#buildbar{grid-template-columns:repeat(4,1fr)}}
.tb{height:54px}
.tb .ic{width:30px;height:30px}
.tb.on{background:var(--sun);transform:translateY(-4px);box-shadow:0 7px 0 var(--ink)}
.tb.on:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.tb small{position:absolute;top:-9px;right:-6px;display:flex;align-items:center;gap:2px;height:19px;min-width:19px;justify-content:center;padding:0 5px;border-radius:10px;
  background:var(--ink);color:var(--paper);font-size:11.5px;font-weight:800;line-height:1}
.tb small .ic{width:10px;height:10px}
.bb{height:60px;align-content:center;gap:1px}
.bb .cost{display:flex;align-items:center;gap:1px;font-size:12px;line-height:1}
.bb .cost .ic{width:14px;height:14px}
.bb .cost b+.ic{margin-left:3px}
.bb.cant{background:var(--paper2)}
.bb.cant>.ic{opacity:.45}
.bb.cant .cost{color:#c93a2a}

/* title screen */
#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:calc(9vh + var(--sat)) 16px calc(8vh + var(--sab));pointer-events:none;transition:opacity .5s;
  background:radial-gradient(ellipse at 50% 55%,rgba(30,24,60,0) 40%,rgba(30,24,60,.42) 100%)}
body:not(.title) #title{opacity:0;visibility:hidden;transition:opacity .5s,visibility 0s .5s}
#title h1{margin:0;display:flex;flex-wrap:wrap;justify-content:center;gap:0 .3em;font-weight:900;font-size:clamp(46px,15vw,104px);line-height:1;letter-spacing:.02em}
#title h1 span{display:inline-flex}
#title h1 i{display:inline-block;font-style:normal;color:var(--paper);-webkit-text-stroke:.14em var(--ink);paint-order:stroke fill;
  text-shadow:0 .09em 0 var(--ink);animation:hop 3.2s cubic-bezier(.4,0,.3,1) infinite;animation-delay:calc(var(--i)*.1s)}
#title h1 i:nth-child(odd){color:var(--sun)}
@keyframes hop{0%,40%,100%{transform:translateY(0) rotate(0)}9%{transform:translateY(-.2em) rotate(-6deg)}18%{transform:translateY(0) rotate(3deg)}25%{transform:translateY(-.05em) rotate(0)}31%{transform:translateY(0)}}
#tBtns{display:flex;gap:18px;align-items:center;pointer-events:auto}
.tbtn{width:68px;height:68px;border-radius:50%;box-shadow:0 5px 0 var(--ink)}
.tbtn .ic{width:36px;height:36px}
.tbtn:active{transform:translateY(5px)}
#tPlay{width:98px;height:98px;background:var(--sun);border-width:3px;box-shadow:0 7px 0 var(--ink);animation:bob 2.2s ease-in-out infinite}
#tPlay .ic{width:50px;height:50px;margin-left:6px}
#tPlay:active{transform:translateY(7px);animation:none}
@keyframes bob{50%{transform:translateY(-5px);box-shadow:0 12px 0 var(--ink)}}
#tRoll.spin .ic{animation:spin .45s cubic-bezier(.3,1.3,.6,1)}
@keyframes spin{from{transform:rotate(-200deg) scale(.7)}}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media (prefers-reduced-motion:reduce){#title h1 i,#tPlay,.toast,#info{animation:none}}
</style>
</head>
<body class="title">
<canvas id="c"></canvas>
<canvas id="o"></canvas>
<div id="vig"></div>

<div id="hud" class="ui">
  <div class="plq tile" id="pA"><span class="st" id="pDay"></span><span class="st" id="pPop"></span></div>
  <div class="plq tile" id="pB"><span class="st" id="pWood"></span><span class="st" id="pFood"></span><span class="st" id="pStone"></span><span class="st" id="pFaith"></span></div>
  <div id="sys"><button class="key" id="bSpeed" aria-label="Game speed"></button><button class="key" id="bMenu" aria-label="Title screen"></button></div>
</div>
<div id="toasts" class="ui"></div>

<div id="bottom" class="ui">
  <div id="info" class="tile" hidden></div>
  <div id="buildbar" hidden></div>
  <div id="toolbar"></div>
</div>

<div id="title">
  <h1 aria-label="KV Island"><span><i style="--i:0">K</i><i style="--i:1">V</i></span><span><i style="--i:2">I</i><i style="--i:3">s</i><i style="--i:4">l</i><i style="--i:5">a</i><i style="--i:6">n</i><i style="--i:7">d</i></span></h1>
  <div id="tBtns">
    <button class="key tbtn" id="tBack" aria-label="Back to saved island" hidden></button>
    <button class="key tbtn" id="tPlay" aria-label="Play"></button>
    <button class="key tbtn" id="tNew" aria-label="New island" hidden></button>
    <button class="key tbtn" id="tRoll" aria-label="Another island" hidden></button>
  </div>
</div>

<script>
'use strict';
/* ================= constants ================= */

function h2(x,y){let n=Math.imul(x,374761393)^Math.imul(y,668265263);n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967296;}

/* ================= generation ================= */
function islandName(seed){
  const r=mulberry(seed^0x9e3779b9),A=['Ka','Lo','Mi','Ta','Ru','Ne','Si','Po','Ha','Vi','Be','Do','Yu','Ze','A','O','Ma','Wai','Ku','Pe'],
    B=['la','ni','ko','ra','mi','to','sa','wen','li','ru','na','hoa','ki','va'],C=['Isle','Atoll','Island','Cay','Haven','Rock'];
  let s=A[Math.floor(r()*A.length)]+B[Math.floor(r()*B.length)];if(r()<.5)s+=B[Math.floor(r()*B.length)];
  return s+' '+C[Math.floor(r()*C.length)];
}
function personName(){
  const A=['Ka','Lo','Mi','Ta','Ru','Ne','Si','Po','Ha','Vi','Be','Do','Yu','Ze','Ani','Olu','Ema','Tem','Nor','Ila','Fen','Gar'],
    B=['la','ni','ko','ra','mi','to','sa','wen','li','ru','na','ki','','','ro','vi'];
  return pick(A)+pick(B);
}
function generate(seed){
  const hash=(x,y,s)=>{let n=Math.imul(x,374761393)^Math.imul(y,668265263)^Math.imul(s+seed|0,1442695041);n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967296;};
  const noise=(x,y,s)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    const a=hash(xi,yi,s),b=hash(xi+1,yi,s),c=hash(xi,yi+1,s),d=hash(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;};
  const fbm=(x,y,o,s)=>{let t=0,a=.5,f=1,m=0;for(let i=0;i<o;i++){t+=a*noise(x*f,y*f,s+i*7);m+=a;a*=.5;f*=2;}return t/m;};
  const r=mulberry(seed);
  const sx=.85+r()*.3,sy=.85+r()*.3,ox=(r()-.5)*.16,oy=(r()-.5)*.16;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const nx=((x+.5)/W*2-1-ox)/sx,ny=((y+.5)/H*2-1-oy)/sy;
    const warp=fbm(nx*1.6+9,ny*1.6+9,3,11)-.5;
    const d=Math.hypot(nx,ny)*(1+warp*1.1);
    const e=fbm(nx*2.4+3,ny*2.4+7,5,1);
    const ridge=Math.max(0,fbm(nx*1.3+20,ny*1.3+20,3,31)-.5);
    let hh=.41+(e-.5)*1.25+ridge*.9+.24*(1-Math.pow(d/.74,2.4));
    const ed=Math.min(x,y,W-1-x,H-1-y);
    if(ed<8)hh-=(8-ed)*.06;
    if(ed<5)hh=Math.min(hh,SEA-.05);
    G.h[y*W+x]=clamp(hh,.04,.98);
  }
  keepLargest();
  for(let i=0;i<N;i++){
    const x=i%W,y=(i/W)|0,t=terr(G.h[i]),f=fbm(x*.11+50,y*.11+50,3,71),q=r();
    G.moist[i]=.4;G.obj[i]=0;G.grow[i]=0;
    if(t===3||t===4){
      if((f>.54&&q<.62)||q<.03){G.obj[i]=O_TREE;G.grow[i]=.45+r()*.55;}
      else if(q<.065){G.obj[i]=O_BUSH;G.grow[i]=.4+r()*.6;}
      else if(q<.11){G.obj[i]=O_FLOWER;G.grow[i]=1;}
      else if(q<(t===4?.2:.125)){G.obj[i]=O_ROCK;G.grow[i]=1;}
    }else if(t===2&&q<.015){G.obj[i]=O_ROCK;G.grow[i]=1;}
  }
}
function keepLargest(){
  const lab=new Int32Array(N),st=[];let best=0,bn=0,c=0;
  for(let s0=0;s0<N;s0++){if(lab[s0]||G.h[s0]<SEA)continue;c++;let n=0;st.push(s0);lab[s0]=c;
    while(st.length){const i=st.pop(),x=i%W,y=(i/W)|0;n++;
      for(const j of [x>0?i-1:-1,x<W-1?i+1:-1,y>0?i-W:-1,y<H-1?i+W:-1])if(j>=0&&!lab[j]&&G.h[j]>=SEA){lab[j]=c;st.push(j);}}
    if(n>bn){bn=n;best=c;}}
  for(let i=0;i<N;i++)if(lab[i]&&lab[i]!==best)G.h[i]=SEA-.04-h2(i,7)*.03;
}
function landStats(){let land=0;for(let i=0;i<N;i++){const t=terr(G.h[i]);if(t>=2&&t<=4)land++;}return land/N;}
function newGame(seedIn){
  let seed=(seedIn>>>0)||((rnd()*4294967295)>>>0)||1;
  for(let tries=0;tries<12;tries++){
    G={v:1,seed,name:islandName(seed),time:.3,dayNum:0,h:new Float32Array(N),moist:new Float32Array(N),wear:new Float32Array(N),
      obj:new Uint8Array(N),grow:new Float32Array(N),bld:new Int32Array(N),buildings:[],villagers:[],animals:[],clouds:[],
      res:{wood:20,food:25,stone:0},faith:60,nextId:1,stats:{births:0,deaths:0,maxPop:0,built:0},auto:true,speed:1,
      cam:{x:W/2,y:H/2,d:0},nextRain:1.2+rnd()*1.5,helped:false};
    generate(seed);
    const lf=landStats();
    if(lf>.17&&lf<.5)break;
    seed=(seed+1)>>>0;
  }
  freshR();bById={};
  // pick the village site
  let best=-1,bs=-1e9;
  for(let y=6;y<H-6;y++)for(let x=6;x<W-6;x++){
    const i=y*W+x;if(terr(G.h[i])!==3)continue;
    let s=0;for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const j=(y+dy)*W+x+dx,t=terr(G.h[j]);
      s+=t===3?1:t===4?.3:-1.2;if(G.obj[j]===O_TREE)s+=.25;}
    s-=Math.hypot(x-W/2,y-H/2)*.25;s+=h2(x+seed,y)*2;
    if(s>bs){bs=s;best=i;}
  }
  if(best<0)for(let i=0;i<N;i++)if(terr(G.h[i])>=2&&terr(G.h[i])<=4){best=i;break;}
  const fx=best%W,fy=(best/W)|0;
  for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const j=(fy+dy)*W+fx+dx;if(G.obj[j]===O_TREE||G.obj[j]===O_ROCK)G.obj[j]=0;}
  const b=addBuilding('fire',fx,fy);b.done=true;b.prog=BD.fire.work;
  refreshLogic();
  for(let k=0;k<5;k++){const v=makeVillager(fx+.5+(rnd()-.5)*3,fy+1.5+rnd()*1.5,4+rnd()*12);G.villagers.push(v);}
  let placed=0;for(let k=0;k<400&&placed<7;k++){const i=ri(N);if(terr(G.h[i])===3&&!G.bld[i]&&Math.hypot(i%W-fx,((i/W)|0)-fy)>6){
    G.animals.push({t:'sheep',x:i%W+.5,y:((i/W)|0)+.5,tx:0,ty:0,w:rnd()*3,d:1,mv:false});placed++;}}
  G.cam.x=fx+.5;G.cam.y=fy+.5;G.cam.d=0;
  fullDirty();R.rise=0;
}
function makeVillager(x,y,age){
  return {id:G.nextId++,name:personName(),x,y,age,life:38+rnd()*22,hunger:.7+rnd()*.3,health:1,happy:.6,home:0,carry:null,
    c:ri(8),sk:ri(4),hr:ri(5),task:null,idle:rnd()*2,sayT:4+rnd()*10,bub:null,look:0,pause:0,dir:1,walk:0,asleep:false,inside:false,
    jx:(rnd()-.5)*.36,jy:(rnd()-.5)*.36,awe:0,ang:0};
}

/* ================= logic caches ================= */
function refreshLogic(){
  R.meshNow=true;
  bById={};for(const b of G.buildings)bById[b.id]=b;
  let stores=0;R.hasShrine=false;R.sites=0;
  for(let i=0;i<N;i++){
    const t=terr(G.h[i]);let w=t>=2&&t<=4;
    if(w&&G.bld[i]){const b=bById[G.bld[i]];if(b&&!BD[b.type].walk)w=false;}
    walk[i]=w?1:0;
  }
  nearWater.fill(0);rockAdj.fill(0);nearFire.fill(0);dropAdj.fill(0);wellNear.fill(0);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const i=y*W+x,t=terr(G.h[i]);
    if(t<2){for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const xx=x+dx,yy=y+dy;if(xx>=0&&yy>=0&&xx<W&&yy<H)nearWater[yy*W+xx]=1;}}
    else if(t===5){if(x>0)rockAdj[i-1]=1;if(x<W-1)rockAdj[i+1]=1;if(y>0)rockAdj[i-W]=1;if(y<H-1)rockAdj[i+W]=1;}
  }
  for(const b of G.buildings){
    const d=BD[b.type];
    if(!b.done){R.sites++;continue;}
    if(b.type==='store')stores++;
    if(b.type==='shrine')R.hasShrine=true;
    const rad=b.type==='well'?4:b.type==='fire'?2:0;
    if(rad)for(let dy=-rad;dy<=rad;dy++)for(let dx=-rad;dx<=rad;dx++){const xx=b.x+dx,yy=b.y+dy;
      if(xx>=0&&yy>=0&&xx<W&&yy<H){if(b.type==='well')wellNear[yy*W+xx]=1;else nearFire[yy*W+xx]=1;}}
    if(b.type==='store'||b.type==='fire')for(let dy=-1;dy<=d.h;dy++)for(let dx=-1;dx<=d.w;dx++){
      if((dx===-1||dx===d.w)&&(dy===-1||dy===d.h))continue;
      const xx=b.x+dx,yy=b.y+dy;if(xx>=0&&yy>=0&&xx<W&&yy<H)dropAdj[yy*W+xx]=1;}
  }
  R.cap=60+80*stores;
}
function markDirty(x,y){const d=R.dirty;if(!d)R.dirty={x0:x,y0:y,x1:x,y1:y};else{if(x<d.x0)d.x0=x;if(y<d.y0)d.y0=y;if(x>d.x1)d.x1=x;if(y>d.y1)d.y1=y;}}
function fullDirty(){R.dirty={x0:0,y0:0,x1:W-1,y1:H-1};R.allNow=R.allTex=true;R.hDirty=true;}

/* ================= pathfinding ================= */
const qbuf=new Int32Array(N),prev=new Int32Array(N),stamp=new Uint32Array(N);let stampC=0;
const DX=[1,-1,0,0,1,1,-1,-1],DY=[0,0,1,-1,1,-1,1,-1];
function bfs(start,goal,maxN){
  maxN=maxN||N;stampC++;let qh=0,qt=0;qbuf[qt++]=start;stamp[start]=stampC;prev[start]=-1;
  while(qh<qt){
    const c=qbuf[qh++];
    if(goal(c)){const p=[];let k=c;while(k>=0){p.push(k);k=prev[k];}p.reverse();return p;}
    if(qh>maxN)break;
    const cx=c%W,cy=(c/W)|0;
    for(let k=0;k<8;k++){
      const nx=cx+DX[k],ny=cy+DY[k];if(nx<0||ny<0||nx>=W||ny>=H)continue;
      const ni=ny*W+nx;if(stamp[ni]===stampC||!walk[ni])continue;
      if(k>=4&&(!walk[cy*W+nx]||!walk[ny*W+cx]))continue;
      stamp[ni]=stampC;prev[ni]=c;qbuf[qt++]=ni;
    }
  }
  return null;
}
function adjBld(i,test){
  const x=i%W,y=(i/W)|0;let b;
  if(x>0&&(b=G.bld[i-1])&&test(b))return b;if(x<W-1&&(b=G.bld[i+1])&&test(b))return b;
  if(y>0&&(b=G.bld[i-W])&&test(b))return b;if(y<H-1&&(b=G.bld[i+W])&&test(b))return b;return 0;
}
function nearestWalk(x,y){
  for(let r=1;r<24;r++){let best=-1,bd=1e9;
    for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;
      const xx=x+dx,yy=y+dy;if(xx<0||yy<0||xx>=W||yy>=H)continue;const i=yy*W+xx;
      if(walk[i]){const d=dx*dx+dy*dy;if(d<bd){bd=d;best=i;}}}
    if(best>=0)return best;}
  return -1;
}

/* ================= buildings ================= */
function canPlace(type,x,y,margin){
  const d=BD[type];let water=false;
  if(x<1||y<1||x+d.w>W-1||y+d.h>H-1)return 'no';
  for(let dy=0;dy<d.h;dy++)for(let dx=0;dx<d.w;dx++){
    const i=(y+dy)*W+x+dx,t=terr(G.h[i]);
    if(t<2)return 'no water';if(t>4)return 'no mountain';if(G.bld[i])return 'no house';
    if(type==='farm'&&t===2)return 'farm no beach';
  }
  if(margin)for(let dy=-1;dy<=d.h;dy++)for(let dx=-1;dx<=d.w;dx++){const i=(y+dy)*W+x+dx;if(G.bld[i]||terr(G.h[i])<2)return 'x';}
  if(type==='hut'){for(let dy=-1;dy<=d.h;dy++)for(let dx=-1;dx<=d.w;dx++){if(terr(G.h[(y+dy)*W+x+dx])<2)water=true;}
    if(!water)return 'fish arrow water';}
  return '';
}
function canAfford(type){const c=BD[type].cost;for(const k in c)if(G.res[k]<c[k])return false;return true;}
function addBuilding(type,x,y){
  const d=BD[type],b={id:G.nextId++,type,x,y,done:false,prog:0,eggs:0,users:0,v:ri(1000)};
  let m=0;for(let dy=0;dy<d.h;dy++)for(let dx=0;dx<d.w;dx++)m+=G.h[(y+dy)*W+x+dx];m=clamp(m/(d.w*d.h),SEA+.012,ROCK-.01);
  for(let dy=0;dy<d.h;dy++)for(let dx=0;dx<d.w;dx++){const i=(y+dy)*W+x+dx;G.h[i]=m;G.bld[i]=b.id;G.obj[i]=0;G.grow[i]=0;claims[i]=0;}
  markDirty(x-1,y-1);markDirty(x+d.w,y+d.h);R.hDirty=true;
  G.buildings.push(b);bById[b.id]=b;return b;
}
function placeBuilding(type,x,y){
  const c=BD[type].cost;for(const k in c)G.res[k]-=c[k];
  const b=addBuilding(type,x,y);refreshLogic();return b;
}
function finishBuilding(b){
  b.done=true;G.stats.built++;const d=BD[b.type];
  if(b.type==='farm')for(let dy=0;dy<d.h;dy++)for(let dx=0;dx<d.w;dx++){const i=(b.y+dy)*W+b.x+dx;G.obj[i]=O_CROP;G.grow[i]=.05;}
  if(b.type==='coop')for(let k=0;k<3;k++)G.animals.push({t:'chicken',x:b.x+.5,y:b.y+1.3,tx:0,ty:0,w:rnd()*2,d:1,mv:false,home:b.id});
  refreshLogic();toast(d.e+' check');
  fxAdd(b.x+d.w/2,b.y+d.h/2,'spark',10);
}
function removeBuilding(b,refund){
  const d=BD[b.type];
  for(let dy=0;dy<d.h;dy++)for(let dx=0;dx<d.w;dx++){const i=(b.y+dy)*W+b.x+dx;G.bld[i]=0;G.obj[i]=0;G.grow[i]=0;}
  G.buildings.splice(G.buildings.indexOf(b),1);
  for(const v of G.villagers){if(v.home===b.id)v.home=0;if(v.task&&v.task.bid===b.id)clearTask(v);}
  G.animals=G.animals.filter(a=>a.home!==b.id);
  if(refund)for(const k in d.cost)G.res[k]=Math.min(R.cap,G.res[k]+Math.floor(d.cost[k]/2));
  refreshLogic();fxAdd(b.x+d.w/2,b.y+d.h/2,'puff',8);
}
function occupants(id){let n=0;for(const v of G.villagers)if(v.home===id)n++;return n;}

/* ================= villagers ================= */
function say(v,e,dur,look){v.bub={e,t:dur||3};if(look){v.look=dur||3;v.pause=Math.max(v.pause,(dur||3)*.8);}}
function clearTask(v){
  const t=v.task;if(!t)return;
  if(t.claim>=0)claims[t.claim]=0;
  if(t.bid){const b=bById[t.bid];if(b&&b.users>0)b.users--;}
  v.task=null;v.asleep=false;v.inside=false;
}
function setTask(v,kind,path,ex){
  const t={kind,path,pi:1,phase:'go',t:0,claim:-1,bid:0};if(ex)Object.assign(t,ex);
  if(t.claim>=0)claims[t.claim]=v.id;
  if(t.bid){const b=bById[t.bid];if(b)b.users++;}
  v.task=t;return true;
}
function tileOf(v){return clamp(Math.floor(v.y),0,H-1)*W+clamp(Math.floor(v.x),0,W-1);}
function tryJob(v,kind,ti){
  let p,found=0;
  switch(kind){
    case 'build':p=bfs(ti,i=>(found=adjBld(i,id=>{const b=bById[id];return b&&!b.done&&b.users<3;}))!==0);
      return p?setTask(v,'build',p,{bid:found}):false;
    case 'crop':p=bfs(ti,i=>G.obj[i]===O_CROP&&G.grow[i]>=1&&!claims[i]);
      return p?setTask(v,'crop',p,{claim:p[p.length-1]}):false;
    case 'berry':p=bfs(ti,i=>G.obj[i]===O_BUSH&&G.grow[i]>=1&&!claims[i],2600);
      return p?setTask(v,'berry',p,{claim:p[p.length-1]}):false;
    case 'wood':p=bfs(ti,i=>G.obj[i]===O_TREE&&G.grow[i]>=.6&&!claims[i]);
      return p?setTask(v,'chop',p,{claim:p[p.length-1]}):false;
    case 'stone':p=bfs(ti,i=>(G.obj[i]===O_ROCK&&!claims[i])||rockAdj[i]);
      if(!p)return false;{const e=p[p.length-1];return setTask(v,'mine',p,{claim:G.obj[e]===O_ROCK?e:-1});}
    case 'fish':p=bfs(ti,i=>(found=adjBld(i,id=>{const b=bById[id];return b&&b.done&&b.type==='hut'&&b.users<2;}))!==0);
      return p?setTask(v,'fish',p,{bid:found}):false;
    case 'eggs':p=bfs(ti,i=>(found=adjBld(i,id=>{const b=bById[id];return b&&b.done&&b.type==='coop'&&b.eggs>=3&&b.users<1;}))!==0);
      return p?setTask(v,'eggs',p,{bid:found}):false;
    case 'pray':p=bfs(ti,i=>(found=adjBld(i,id=>{const b=bById[id];return b&&b.done&&b.type==='shrine';}))!==0&&rnd()<.4,2500);
      return p?setTask(v,'pray',p,{dur:5+rnd()*4}):false;
    case 'social':p=bfs(ti,i=>nearFire[i]&&rnd()<.25,2500);
      return p?setTask(v,'social',p,{dur:3+rnd()*5}):false;
    case 'hunt':{const set=new Set();for(const a of G.animals)if(a.t==='sheep')set.add(Math.floor(a.y)*W+Math.floor(a.x));
      if(!set.size)return false;p=bfs(ti,i=>set.has(i),2500);return p?setTask(v,'hunt',p):false;}
    case 'wander':{const x=clamp(Math.floor(v.x)+ri(11)-5,0,W-1),y=clamp(Math.floor(v.y)+ri(11)-5,0,H-1),g=y*W+x;
      if(!walk[g])return false;p=bfs(ti,i=>i===g,300);return p?setTask(v,'wander',p,{dur:1+rnd()*3}):false;}
  }
  return false;
}
function think(v){
  const ti=tileOf(v),res=G.res,pop=R.pop||1,now=R.clock;
  // mood
  let h=.5;h+=v.hunger>.5?.2:v.hunger<.2?-.3:0;h+=v.home?.15:(v.age>=ADULT?-.15:0);if(R.hasShrine)h+=.1;if(res.food>pop*3)h+=.05;
  v.happy=lerp(v.happy,clamp(h,0,1),.3);
  if(R.sleep){
    let p=null;
    if(v.home&&bById[v.home])p=bfs(ti,i=>adjBld(i,id=>id===v.home)!==0);
    if(p)return setTask(v,'sleep',p,{home:true});
    p=bfs(ti,i=>nearFire[i]&&rnd()<.3,1500);
    return setTask(v,'sleep',p||[ti],{home:false});
  }
  if(v.hunger<.45){
    if(res.food>=1){res.food-=1;v.hunger=Math.min(1,v.hunger+.55);return setTask(v,'eat',[ti],{dur:1.2});}
    if(v.hunger<.35){
      if(tryJob(v,'berry',ti)){v.task.eat=true;return true;}
      if(v.age>=ADULT&&tryJob(v,'hunt',ti))return true;
    }
  }
  if(v.carry){
    const p=bfs(ti,i=>dropAdj[i]===1);
    if(p)return setTask(v,'deliver',p);
    res[v.carry.k]=Math.min(R.cap,res[v.carry.k]+v.carry.n);v.carry=null;
  }
  if(v.age<ADULT)return tryJob(v,rnd()<.4?'social':'wander',ti)||tryJob(v,'wander',ti);
  const w={},crit=res.food<pop,need=res.food<pop*3,cap=R.cap;
  if(R.sites)w.build=crit?2:10;
  if(res.food<cap){const plenty=res.food>pop*8+20;w.crop=plenty?.6:7;w.eggs=plenty?.4:4;w.fish=need?6:plenty?0:1.5;w.berry=need?5:res.food<pop*5?1:0;}
  const wt=Math.min(cap,30+pop*2);
  if(res.wood<wt)w.wood=res.wood<12?8:4;
  if(res.stone<Math.min(cap,20))w.stone=2.5;
  if(R.hasShrine)w.pray=1.3;
  w.social=1;w.wander=.8;
  const order=[];for(const k in w){if(w[k]>0&&!(R.fail[k]>now))order.push([k,Math.pow(rnd(),1/w[k])]);}
  order.sort((a,b)=>b[1]-a[1]);
  for(const [k] of order){if(tryJob(v,k,ti))return true;if(k!=='wander'&&k!=='social'&&k!=='pray')R.fail[k]=now+4;}
  return false;
}
function pickSay(v){
  const res=G.res,pop=R.pop||1,adult=v.age>=ADULT,f=G.time%1;
  if(v.hunger<.3&&res.food<1)return say(v,'food',3.2,true);
  if(adult&&!v.home)return say(v,(f>.8||f<.25)?'cold':'house',3.2,true);
  if(res.food<pop&&rnd()<.6)return say(v,'food',3.2,true);
  if(R.want==='wood'&&rnd()<.5)return say(v,R.trees<10?'tree':'wood',3.2,true);
  if(R.want==='room'&&rnd()<.3)return say(v,'house',3.2,true);
  if(R.dry&&rnd()<.3)return say(v,'drop',3.2,true);
  if(pop>=10&&!R.hasShrine&&rnd()<.2)return say(v,'shrine',3.2,true);
  if(v.happy>.7&&rnd()<.4){const e=pick(['heart','smile','note','faith','flower']);return say(v,e,2.4,e==='faith');}
}
function moveToward(v,tx,ty,sp,dt){
  const dx=tx-v.x,dy=ty-v.y,d=Math.hypot(dx,dy),st=sp*dt;
  if(d<=st){v.x=tx;v.y=ty;return true;}
  v.x+=dx/d*st;v.y+=dy/d*st;v.ang=Math.atan2(dx,dy);if(Math.abs(dx)>.02)v.dir=dx>0?1:-1;v.walk+=st*9;return false;
}
function die(v,why){
  clearTask(v);const i=tileOf(v);
  if(walk[i]&&!G.bld[i]&&!G.obj[i]){G.obj[i]=O_GRAVE;G.grow[i]=1;R.meshNow=true;}
  G.villagers.splice(G.villagers.indexOf(v),1);G.stats.deaths++;
  toast(why==='age'?'grave':'grave food cross');
  if(R.sel&&R.sel.v===v)select(null);
}
function updV(v,dt){
  v.age+=dt/DAY;v.hunger-=dt/(1.25*DAY);
  if(v.hunger<=0){v.hunger=0;v.health-=dt/(1.6*DAY);if(v.health<=0)return die(v,'hunger');}
  else if(v.health<1)v.health=Math.min(1,v.health+dt/DAY);
  if(v.bub){v.bub.t-=dt;if(v.bub.t<=0)v.bub=null;}
  if(v.look>0)v.look-=dt;if(v.awe>0)v.awe-=dt;
  const ti=tileOf(v);
  if(!v.asleep){v.sayT-=dt;if(v.sayT<=0){v.sayT=9+rnd()*16;pickSay(v);}}
  if(!walk[ti]&&!v.inside&&!(v.task&&v.task.kind==='swim')){
    clearTask(v);const g=nearestWalk(ti%W,(ti/W)|0);
    if(g>=0)v.task={kind:'swim',phase:'go',path:[ti],pi:1,t:0,claim:-1,bid:0,gx:g%W+.5,gy:((g/W)|0)+.5};
    return;
  }
  if(v.pause>0){v.pause-=dt;return;}
  const t=v.task;
  if(!t){v.idle-=dt;if(v.idle<=0){if(!think(v))v.idle=.6+rnd()*1.5;}return;}
  if(t.kind==='swim'){if(moveToward(v,t.gx,t.gy,terr(G.h[ti])<2?.9:1.6,dt))v.task=null;return;}
  if(t.phase==='go'){
    if(t.pi>=t.path.length){t.phase='work';t.t=0;return;}
    const ni=t.path[t.pi];if(!walk[ni]){clearTask(v);return;}
    const last=t.pi===t.path.length-1;
    const tx=ni%W+.5+(last?v.jx:v.jx*.5),ty=((ni/W)|0)+.5+(last?v.jy:v.jy*.5);
    const sp=(v.age<ADULT?1.7:2.1)*(v.carry?.85:1)*(v.hunger<.1?.7:1);
    if(moveToward(v,tx,ty,sp,dt))t.pi++;
    if(G.wear[ti]<1)G.wear[ti]=Math.min(1,G.wear[ti]+dt*.04);
    return;
  }
  t.t+=dt;const ci=t.claim;
  switch(t.kind){
    case 'chop':if(G.obj[ci]!==O_TREE)return clearTask(v);
      if(t.t>=4){if(rnd()<.4){G.grow[ci]=.08;}else{G.obj[ci]=0;G.grow[ci]=0;}v.carry={k:'wood',n:3};fxAdd(ci%W+.5,((ci/W)|0)+.5,'puff',4);clearTask(v);}break;
    case 'berry':if(G.obj[ci]!==O_BUSH)return clearTask(v);
      if(t.t>=3){G.grow[ci]=.15;R.meshNow=true;if(t.eat){v.hunger=Math.min(1,v.hunger+.5);}else v.carry={k:'food',n:2};clearTask(v);}break;
    case 'crop':if(G.obj[ci]!==O_CROP)return clearTask(v);
      if(t.t>=2.5){G.grow[ci]=.03;R.meshNow=true;v.carry={k:'food',n:3};clearTask(v);}break;
    case 'mine':if(t.t>=5){if(ci>=0&&G.obj[ci]===O_ROCK){G.grow[ci]-=.34;if(G.grow[ci]<=.02){G.obj[ci]=0;G.grow[ci]=0;}}
      v.carry={k:'stone',n:2};R.meshNow=true;clearTask(v);}break;
    case 'fish':if(t.t>=9){v.carry={k:'food',n:2};clearTask(v);}break;
    case 'eggs':{const b=bById[t.bid];if(!b)return clearTask(v);
      if(t.t>=2){const n=Math.floor(b.eggs);b.eggs-=n;R.meshNow=true;if(n>0)v.carry={k:'food',n};clearTask(v);}break;}
    case 'build':{const b=bById[t.bid];if(!b||b.done)return clearTask(v);
      b.prog+=dt;if(b.prog>=BD[b.type].work){finishBuilding(b);clearTask(v);}break;}
    case 'deliver':G.res[v.carry.k]=Math.min(R.cap,G.res[v.carry.k]+v.carry.n);v.carry=null;clearTask(v);break;
    case 'hunt':{let got=null;for(const a of G.animals)if(a.t==='sheep'&&Math.hypot(a.x-v.x,a.y-v.y)<1.6){got=a;break;}
      if(got){G.animals.splice(G.animals.indexOf(got),1);v.carry={k:'food',n:4};}clearTask(v);break;}
    case 'sleep':v.asleep=true;v.inside=!!t.home&&!!bById[v.home];
      if(!R.sleep){clearTask(v);v.sayT=Math.min(v.sayT,2+rnd()*6);}break;
    case 'pray':G.faith=Math.min(faithCap(),G.faith+dt*.3);if(t.t>=t.dur){v.happy=Math.min(1,v.happy+.1);clearTask(v);}break;
    default:if(t.t>=(t.dur||2))clearTask(v);
  }
}
const faithCap=()=>100+(R.hasShrine?50:0);

/* ================= village planning ================= */
function assignHomes(){
  const houses=G.buildings.filter(b=>b.type==='house'&&b.done);if(!houses.length)return;
  const occ={},ad={};for(const b of houses){occ[b.id]=0;ad[b.id]=0;}
  for(const v of G.villagers){if(v.home&&occ[v.home]===undefined)v.home=0;if(v.home){occ[v.home]++;if(v.age>=ADULT)ad[v.home]++;}}
  for(const v of G.villagers)if(!v.home){
    let best=null,bd=1e9;for(const b of houses)if(occ[b.id]<4){const d=Math.hypot(b.x-v.x,b.y-v.y)-(ad[b.id]===1?8:0);if(d<bd){bd=d;best=b;}}
    if(best){v.home=best.id;occ[best.id]++;if(v.age>=ADULT)ad[best.id]++;}
  }
  for(const dst of houses)if(ad[dst.id]<=1&&occ[dst.id]<=2){
    const src=houses.find(b=>b!==dst&&ad[b.id]>=3);if(!src)continue;
    const mv=G.villagers.find(v=>v.home===src.id&&v.age>=ADULT&&!v.inside);
    if(mv){mv.home=dst.id;ad[src.id]--;occ[src.id]--;ad[dst.id]++;occ[dst.id]++;}
  }
}
function findSpot(type){
  const anchors=G.buildings.filter(b=>b.done||b.type==='house');if(!anchors.length)return null;
  const from=G.villagers.find(v=>walk[tileOf(v)]&&!v.inside);if(!from)return null;
  const d=BD[type];
  for(let tries=0;tries<3;tries++){
    const a=pick(anchors),ax=a.x,ay=a.y;
    for(let r=2;r<=13;r++){
      const c=[];
      for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
        if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;
        const x=ax+dx,y=ay+dy;if(x<2||y<2||x+d.w>W-2||y+d.h>H-2)continue;
        if(canPlace(type,x,y,true)==='')c.push([x,y,G.moist[y*W+x]+rnd()*.5-(terr(G.h[y*W+x])===2?.6:0)]);
      }
      if(!c.length)continue;
      c.sort((p,q)=>q[2]-p[2]);
      for(let k=0;k<Math.min(3,c.length);k++){const g=c[k][1]*W+c[k][0];if(bfs(tileOf(from),i=>i===g))return c[k];}
    }
  }
  return null;
}
function elder(){
  R.want=null;
  const pop=G.villagers.length;if(!pop)return;
  const pend={};let farms=0;const free=[];let homeless=0;
  for(const b of G.buildings){if(!b.done)pend[b.type]=1;if(b.type==='farm')farms++;if(b.type==='house')free.push(4-(b.done?occupants(b.id):0));}
  for(const v of G.villagers)if(!v.home&&v.age>=ADULT)homeless++;
  const pendHouseRoom=G.buildings.filter(b=>b.type==='house'&&!b.done).length*4;
  const needHouse=pop<MAXPOP&&(homeless>pendHouseRoom||(!pend.house&&!free.some(f=>f>=2)));
  const needFarm=!pend.farm&&farms<Math.ceil(pop/5)&&free.length>=1;
  if(needHouse)R.want=G.res.wood<10?'wood':(homeless?null:'room');
  if(!G.auto)return;
  if(needFarm&&G.res.wood>=5&&(farms===0||!needHouse||G.res.wood>=15)){const s=findSpot('farm');if(s){placeBuilding('farm',s[0],s[1]);return;}}
  if(needHouse&&!pend.house){if(G.res.wood>=10){const s=findSpot('house');if(s){placeBuilding('house',s[0],s[1]);R.want=null;}}return;}
  if(!pend.store&&G.res.wood>=25&&(G.res.wood>=R.cap*.9||G.res.food>=R.cap*.95)&&(R.cap-60)/80<Math.ceil(pop/12)){const s=findSpot('store');if(s)placeBuilding('store',s[0],s[1]);}
}
function onDawn(){
  const pop=G.villagers.length;
  for(const v of G.villagers.slice())if(v.age>v.life)die(v,'age');
  for(const b of G.buildings)if(b.type==='house'&&b.done){
    const occ=G.villagers.filter(v=>v.home===b.id),ad=occ.filter(v=>v.age>=ADULT);
    if(ad.length>=2&&occ.length<4&&G.res.food>=pop*1.5+2&&G.villagers.length<MAXPOP&&rnd()<.5){
      const baby=makeVillager(b.x+1,b.y+2.3,0);baby.home=b.id;baby.hunger=.9;G.villagers.push(baby);G.stats.births++;
      toast('baby');
      say(ad[0],'heart',4);say(ad[1],'heart',4);
    }
  }
  const sheep=G.animals.filter(a=>a.t==='sheep');
  if(sheep.length>=2&&sheep.length<14&&rnd()<.6){const m=pick(sheep);G.animals.push({t:'sheep',x:m.x,y:m.y,tx:0,ty:0,w:1,d:1,mv:false});}
  else if(sheep.length<2&&rnd()<.3){const i=ri(N);if(walk[i]&&terr(G.h[i])===3)G.animals.push({t:'sheep',x:i%W+.5,y:((i/W)|0)+.5,tx:0,ty:0,w:1,d:1,mv:false});}
  const p=G.villagers.length;
  if(p>G.stats.maxPop){for(const m of [10,20,35,50,75])if(G.stats.maxPop<m&&p>=m)toast('star people '+m);G.stats.maxPop=p;}
  save();
}

/* ================= animals, weather, world tick ================= */
function updAnimal(a,dt){
  const i=clamp(Math.floor(a.y),0,H-1)*W+clamp(Math.floor(a.x),0,W-1);
  if(!walk[i]){const g=nearestWalk(i%W,(i/W)|0);if(g>=0){a.tx=g%W+.5;a.ty=((g/W)|0)+.5;a.mv=true;}}
  a.w-=dt;
  if(a.w<=0&&!a.mv){
    const hb=a.home&&bById[a.home],ang=rnd()*6.283,d=1+rnd()*2.5;
    let tx=a.x+Math.cos(ang)*d,ty=a.y+Math.sin(ang)*d;
    if(hb&&Math.hypot(tx-hb.x-.5,ty-hb.y-.5)>2.6){tx=hb.x+.5+(rnd()-.5)*3;ty=hb.y+.5+(rnd()-.5)*3;}
    const xi=Math.floor(tx),yi=Math.floor(ty);
    if(xi>=0&&yi>=0&&xi<W&&yi<H&&walk[yi*W+xi]&&(a.t!=='sheep'||terr(G.h[yi*W+xi])>=3)){a.tx=tx;a.ty=ty;a.mv=true;}
    a.w=2+rnd()*7;
  }
  if(a.mv){
    const dx=a.tx-a.x,dy=a.ty-a.y,d=Math.hypot(dx,dy),st=(a.t==='sheep'?.7:.9)*dt;
    if(d<=st){a.mv=false;}else{
      const nx=a.x+dx/d*st,ny=a.y+dy/d*st,ni=clamp(Math.floor(ny),0,H-1)*W+clamp(Math.floor(nx),0,W-1);
      if(walk[ni]||!walk[i]){a.x=nx;a.y=ny;a.ang=Math.atan2(dx,dy);}else a.mv=false;}
  }
}
function makeRain(x,y,natural){
  if(natural){const ang=rnd()*6.283,sp=.45+rnd()*.3;
    G.clouds.push({x:W/2-Math.cos(ang)*46,y:H/2-Math.sin(ang)*46,r:8+rnd()*3,life:92/sp,max:92/sp,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp});}
  else G.clouds.push({x,y,r:3.6,life:11,max:11,vx:0,vy:0});
}
function updCloud(c,dt){
  c.life-=dt;c.x+=c.vx*dt;c.y+=c.vy*dt;
  const x0=Math.max(0,Math.floor(c.x-c.r)),x1=Math.min(W-1,Math.ceil(c.x+c.r)),y0=Math.max(0,Math.floor(c.y-c.r)),y1=Math.min(H-1,Math.ceil(c.y+c.r)),r2=c.r*c.r;
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const dx=x+.5-c.x,dy=y+.5-c.y;if(dx*dx+dy*dy<r2){const i=y*W+x;if(G.moist[i]<1)G.moist[i]=Math.min(1,G.moist[i]+dt*.22);}}
}
function awe(x,y,r,e){
  for(const v of G.villagers){if(v.awe>0||v.asleep||v.inside)continue;
    if(Math.hypot(v.x-x,v.y-y)<r){v.awe=14;if(rnd()<.6)say(v,e||pick(['wow','faith','heart']),2,true);}}
}
function slowTick(dt){
  let trees=0,cm=0,cn=0;
  const {h,moist,wear,obj,grow}=G;
  for(let i=0;i<N;i++){
    const base=wellNear[i]?.78:nearWater[i]?.58:.34;
    moist[i]+=(base-moist[i])*dt/(.7*DAY);
    if(wear[i]>0){wear[i]-=dt/(3.5*DAY)*(wear[i]+.15);if(wear[i]<0)wear[i]=0;}
    const o=obj[i];
    if(o){
      const mult=.3+1.5*moist[i];
      if(o===O_TREE){if(grow[i]<1)grow[i]=Math.min(1,grow[i]+dt/(3*DAY)*mult);if(grow[i]>=.6)trees++;}
      else if(o===O_BUSH){if(grow[i]<1)grow[i]=Math.min(1,grow[i]+dt/(1.3*DAY)*mult);}
      else if(o===O_CROP){if(grow[i]<1)grow[i]=Math.min(1,grow[i]+dt/(1.05*DAY)*mult);cm+=moist[i];cn++;}
      else if(o===O_GRAVE){grow[i]-=dt/(6*DAY);if(grow[i]<=0){obj[i]=O_FLOWER;grow[i]=1;}}
      else if(o===O_FLOWER&&wear[i]>.5)obj[i]=0;
    }
    const q=((moist[i]*8)|0)|(((wear[i]*8)|0)<<4);
    if(q!==qv[i]){qv[i]=q;markDirty(i%W,(i/W)|0);}
  }
  R.trees=trees;R.dry=cn>0&&cm/cn<.42;
  // plants spread
  for(let k=0;k<24;k++){
    const i=ri(N),o=obj[i];if(!(o===O_TREE&&grow[i]>=.9)&&o!==O_FLOWER&&!(o===O_BUSH&&rnd()<.25))continue;
    if(rnd()>(o===O_TREE?.07:.02)*(.3+1.5*moist[i]))continue;
    const x=i%W+ri(5)-2,y=((i/W)|0)+ri(5)-2;if(x<0||y<0||x>=W||y>=H)continue;
    const j=y*W+x,t=terr(h[j]);if((t!==3&&t!==4)||obj[j]||G.bld[j]||wear[j]>.25)continue;
    obj[j]=o;grow[j]=o===O_FLOWER?1:.1;
  }
  for(const b of G.buildings)if(b.type==='coop'&&b.done&&b.eggs<8)b.eggs+=dt*3/(.4*DAY);
}
function step(dt){
  G.time+=dt/DAY;R.clock+=dt;
  const f=G.time%1;R.sleep=f>.87||f<.22;
  const dn=Math.floor(G.time-.25);if(dn!==G.dayNum){G.dayNum=dn;onDawn();}
  const vs=G.villagers;for(let i=vs.length-1;i>=0;i--)if(vs[i])updV(vs[i],dt);
  for(const a of G.animals)updAnimal(a,dt);
  for(let i=G.clouds.length-1;i>=0;i--){const c=G.clouds[i];updCloud(c,dt);if(c.life<=0)G.clouds.splice(i,1);}
  if(G.time>G.nextRain){G.nextRain=G.time+1.6+rnd()*2.8;makeRain(0,0,true);toast('rain');}
  R.slow+=dt;while(R.slow>=1){R.slow-=1;slowTick(1);}
  R.elderT-=dt;if(R.elderT<=0){R.elderT=3;assignHomes();elder();}
  R.pop=vs.length;
  let hs=0;for(const v of vs)hs+=v.happy;
  G.faith=Math.min(faithCap(),G.faith+dt*(.07+.012*hs));
  if(!vs.length){R.emptyT+=dt;if(R.emptyT>8){R.emptyT=0;
    const f0=G.buildings.find(b=>b.type==='fire');let g=f0?nearestWalk(f0.x,f0.y):nearestWalk(W>>1,H>>1);
    if(g>=0){for(let k=0;k<3;k++)vs.push(makeVillager(g%W+.5,((g/W)|0)+.5,4+rnd()*8));G.res.food=Math.max(G.res.food,12);toast('boat');}}}
}

/* ================= god powers ================= */
function spend(n){if(G.faith<n){flash('pFaith');if(!R.noFaithT||performance.now()-R.noFaithT>2500){R.noFaithT=performance.now();toast('faith cross');}return false;}G.faith-=n;return true;}
function sculpt(wx,wy,dir){
  if(!spend(.2))return;
  const r=2.4,x0=Math.max(3,Math.floor(wx-r)),x1=Math.min(W-4,Math.ceil(wx+r)),y0=Math.max(3,Math.floor(wy-r)),y1=Math.min(H-4,Math.ceil(wy+r));
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const d=Math.hypot(x+.5-wx,y+.5-wy);if(d>=r)continue;const i=y*W+x;if(G.bld[i])continue;
    const f=1-d/r;G.h[i]=clamp(G.h[i]+dir*.03*f*f,.05,.97);
    const t=terr(G.h[i]);if((t<2||t>4)&&G.obj[i]){G.obj[i]=0;G.grow[i]=0;}
    else if(t===2&&(G.obj[i]===O_TREE||G.obj[i]===O_BUSH||G.obj[i]===O_FLOWER)){G.obj[i]=0;G.grow[i]=0;}
  }
  markDirty(x0-1,y0-1);markDirty(x1+1,y1+1);R.hDirty=true;refreshLogic();awe(wx,wy,5);
}
function growAt(i){
  const t=terr(G.h[i]),o=G.obj[i],x=i%W+.5,y=((i/W)|0)+.5;
  if(o===O_CROP||o===O_TREE||o===O_BUSH){if(G.grow[i]>=1)return;if(!spend(1))return;G.grow[i]=o===O_TREE?Math.min(1,G.grow[i]+.5):1;fxAdd(x,y,'spark',5);awe(x,y,4);return;}
  if(G.bld[i]||o)return;
  if(t!==3&&t!==4){if(t===2&&(!R.sandT||performance.now()-R.sandT>3000)){R.sandT=performance.now();toast('sprout no beach');}return;}
  if(!spend(1))return;
  const q=rnd();G.obj[i]=q<.68?O_TREE:q<.88?O_BUSH:O_FLOWER;G.grow[i]=G.obj[i]===O_FLOWER?1:G.obj[i]===O_BUSH?.5:.2;
  fxAdd(x,y,'spark',5);awe(x,y,4);
}
function clearAt(i){
  const o=G.obj[i];if(!o||o===O_CROP||G.bld[i])return;
  G.obj[i]=0;G.grow[i]=0;claims[i]=0;fxAdd(i%W+.5,((i/W)|0)+.5,'puff',5);awe(i%W+.5,((i/W)|0)+.5,4);
}
function fxAdd(x,y,type,n){R.meshNow=true;if(R.fx.length>120)return;for(let k=0;k<n;k++)R.fx.push({x:x+(rnd()-.5)*.8,y:y+(rnd()-.5)*.6,vx:(rnd()-.5)*.6,vy:-.4-rnd()*.8,t:0,life:.6+rnd()*.6,type});}

  try{

      speed:G.speed,cam:G.cam,nextRain:G.nextRain,helped:G.helped,
      h:q(G.h,1000),moist:q(G.moist,100),wear:q(G.wear,100),grow:q(G.grow,100),obj:Array.from(G.obj),bld:Array.from(G.bld),
      buildings:G.buildings.map(b=>({id:b.id,type:b.type,x:b.x,y:b.y,done:b.done,prog:b.prog,eggs:b.eggs,v:b.v})),
      villagers:G.villagers.map(v=>({id:v.id,name:v.name,x:+v.x.toFixed(2),y:+v.y.toFixed(2),age:v.age,life:v.life,hunger:v.hunger,health:v.health,
        happy:v.happy,home:v.home,carry:v.carry,c:v.c,sk:v.sk,hr:v.hr})),
      animals:G.animals.map(a=>({t:a.t,x:+a.x.toFixed(2),y:+a.y.toFixed(2),home:a.home||0})),clouds:G.clouds};
    localStorage.setItem(SAVE_KEY,JSON.stringify(d));
  }catch(e){}
}
function load(){
  let d;try{d=JSON.parse(localStorage.getItem(SAVE_KEY));}catch(e){return false;}
  if(!d||d.v!==1||!d.h||d.h.length!==N)return false;
  try{
    const f=(a,m)=>Float32Array.from(a,v=>v/m);
    G={v:1,seed:d.seed,name:d.name,time:d.time,dayNum:d.dayNum,res:d.res,faith:d.faith,nextId:d.nextId,stats:d.stats,auto:d.auto,
      speed:d.speed||1,cam:d.cam,nextRain:d.nextRain,helped:d.helped,
      h:f(d.h,1000),moist:f(d.moist,100),wear:f(d.wear,100),grow:f(d.grow,100),obj:Uint8Array.from(d.obj),bld:Int32Array.from(d.bld),
      buildings:d.buildings.map(b=>Object.assign({users:0},b)),villagers:[],animals:d.animals.map(a=>({t:a.t,x:a.x,y:a.y,tx:0,ty:0,w:rnd()*3,d:1,mv:false,home:a.home||undefined})),
      clouds:d.clouds||[]};
    freshR();
    for(const s of d.villagers){const v=makeVillager(s.x,s.y,s.age);G.nextId--;Object.assign(v,s);G.villagers.push(v);}
    refreshLogic();fullDirty();return true;
  }catch(e){G=null;return false;}
}

/* ================= terrain maps ================= */
// Two maps cover the island at eight texels a tile. TEXD is the painted ground colour, with the height near sea level in alpha so the
// water shader can find the shore. TEXS says which close-up surface shows where: R sand, G rock, B bare earth, A how smooth it is
// (snow, deep silt). Whatever is left over is grass.
const TS=W*TX,TEXD=new Uint8Array(TS*TS*4),TEXS=new Uint8Array(TS*TS*4);
function samp(a,u,v){
  let x=u-.5,y=v-.5;if(x<0)x=0;else if(x>W-1.001)x=W-1.001;if(y<0)y=0;else if(y>H-1.001)y=H-1.001;
  const x0=x|0,y0=y|0,fx=x-x0,fy=y-y0,i=y0*W+x0;
  return (a[i]*(1-fx)+a[i+1]*fx)*(1-fy)+(a[i+W]*(1-fx)+a[i+W+1]*fx)*fy;
}
// heights are read through a Catmull-Rom patch, so slopes roll over instead of creasing at every tile
function hs(u,v){
  let x=u-.5,y=v-.5;if(x<0)x=0;else if(x>W-1.001)x=W-1.001;if(y<0)y=0;else if(y>H-1.001)y=H-1.001;
  const x1=x|0,y1=y|0,fx=x-x1,fy=y-y1,x0=x1>0?x1-1:0,x2=x1+1,x3=x2<W-1?x2+1:x2,h=G.h;
  const a0=((-.5*fx+1)*fx-.5)*fx,a1=(1.5*fx-2.5)*fx*fx+1,a2=((-1.5*fx+2)*fx+.5)*fx,a3=(.5*fx-.5)*fx*fx;
  const b0=((-.5*fy+1)*fy-.5)*fy,b1=(1.5*fy-2.5)*fy*fy+1,b2=((-1.5*fy+2)*fy+.5)*fy,b3=(.5*fy-.5)*fy*fy;
  const r0=(y1>0?y1-1:0)*W,r1=y1*W,r2=r1+W,r3=(y1+2<H?y1+2:y1+1)*W;
  return b0*(h[r0+x0]*a0+h[r0+x1]*a1+h[r0+x2]*a2+h[r0+x3]*a3)+b1*(h[r1+x0]*a0+h[r1+x1]*a1+h[r1+x2]*a2+h[r1+x3]*a3)
        +b2*(h[r2+x0]*a0+h[r2+x1]*a1+h[r2+x2]*a2+h[r2+x3]*a3)+b3*(h[r3+x0]*a0+h[r3+x1]*a1+h[r3+x2]*a2+h[r3+x3]*a3);
}
function vnoise(x,y){
  const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=h2(xi,yi),b=h2(xi+1,yi),c=h2(xi,yi+1),d=h2(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
const TNOISE=new Float32Array(TS*TS);
for(let Y=0,k=0;Y<TS;Y++)for(let X=0;X<TS;X++)TNOISE[k++]=(vnoise(X*.045+11,Y*.045+5)-.5)*.6+(vnoise(X*.19+3,Y*.19+17)-.5)*.3+(h2(X,Y)-.5)*.1;
// the colour of open grass, shared with the tufts that grow out of it
const GT=[0,0,0];
function grassTint(h,mo){
  const m=clamp((mo-.2)/.6,0,1),alt=clamp((h-SAND)/(ROCK-SAND),0,1)*.6;
  GT[0]=lerp(lerp(190,104,m),68,alt);GT[1]=lerp(lerp(190,178,m),126,alt);GT[2]=lerp(lerp(102,84,m),86,alt);
}
function redrawTerrain(x0,y0,x1,y1){
  x0=clamp(x0,0,W-1);y0=clamp(y0,0,H-1);x1=clamp(x1,0,W-1);y1=clamp(y1,0,H-1);
  const px0=x0*TX,py0=y0*TX,pw=(x1-x0+1)*TX,ph=(y1-y0+1)*TX,sw=pw+2;
  const hb=new Float32Array(sw*(ph+2));
  for(let j=-1;j<=ph;j++)for(let i=-1;i<=pw;i++)hb[(j+1)*sw+i+1]=hs((px0+i+.5)/TX,(py0+j+.5)/TX);
  const D=TEXD,S=TEXS;
  for(let j=0;j<ph;j++)for(let i=0;i<pw;i++){
    const k=(j+1)*sw+i+1,h=hb[k],X=px0+i,Y=py0+j,u=(X+.5)/TX,v=(Y+.5)/TX;
    let r,g,b,sS=0,sR=0,sD=0,sA=0;
    const n=TNOISE[Y*TS+X];   // soft painted blotches at two scales; the fine grain comes from the detail map in the shader
    if(h<SEA){
      const t=Math.pow(clamp((SEA-h)/.15,0,1),.75);
      r=lerp(120,20,t);g=lerp(214,82,t);b=lerp(200,150,t);
      if(SEA-h<.02){const f=1-(SEA-h)/.02;r=lerp(r,214,f);g=lerp(g,206,f);b=lerp(b,160,f);}
      r+=n*10;g+=n*10;b+=n*8;sS=1;sA=clamp((SEA-h)/.12,0,1)*.8;
    }else{
      const sl=Math.hypot(hb[k+1]-hb[k-1],hb[k+sw]-hb[k-sw])*TX*.5;   // height change per tile
      if(h<SAND){const t=clamp((h-SEA)/.012,0,1);r=lerp(196,234,t);g=lerp(172,214,t);b=lerp(122,162,t);sS=1;}
      else if(h<ROCK+.02){
        grassTint(h,samp(G.moist,u,v));r=GT[0]+n*26;g=GT[1]+n*20;b=GT[2]+n*10;
        const cl=clamp((sl-.085)/.06,0,1)*clamp((h-SAND)/.03,0,1);   // steep banks show bare earth
        if(cl>0){const f=cl*.8;r=lerp(r,146,f);g=lerp(g,130,f);b=lerp(b,112,f);sD=cl*.9;}
        const w=samp(G.wear,u,v);if(w>.02){const f=Math.min(w,1)*.85;r=lerp(r,186,f);g=lerp(g,154,f);b=lerp(b,106,f);sD=Math.max(sD,Math.min(1,f*1.15));}
        const rk=clamp((sl-.2)/.09,0,1)*clamp((h-SAND)/.04,0,1);       // and the steepest are rock faces
        if(rk>0){const f=rk*.8;r=lerp(r,132,f);g=lerp(g,127,f);b=lerp(b,124,f);sR=rk;sD*=1-rk;}
        if(h<SAND+.02){const t=(h-SAND)/.02;r=lerp(234,r,t);g=lerp(214,g,t);b=lerp(162,b,t);sS=1-t;sD*=t;sR*=t;}
        if(h>ROCK){const t=(h-ROCK)/.02;r=lerp(r,134,t);g=lerp(g,128,t);b=lerp(b,128,t);sR=Math.max(sR,t);sD*=1-t;}
      }else{
        const t=clamp((h-ROCK)/(SNOW-ROCK),0,1),st=.5+.5*Math.sin(h*260+n*5);   // strata
        r=lerp(128,166,t)+st*10;g=lerp(122,160,t)+st*9;b=lerp(124,166,t)+st*8;sR=1;
        if(h>SNOW-.025){const f=clamp((h-SNOW+.025)/.03+n*.5,0,1);r=lerp(r,250,f);g=lerp(g,251,f);b=lerp(b,255,f);sA=f;}
        r+=n*18;g+=n*18;b+=n*18;
      }
    }
    const o=(Y*TS+X)*4;D[o]=clamp(r,0,255);D[o+1]=clamp(g,0,255);D[o+2]=clamp(b,0,255);D[o+3]=clamp((h-SEA+.13)/.17,0,1)*255;
    S[o]=sS*255;S[o+1]=sR*255;S[o+2]=sD*255;S[o+3]=sA*255;
  }
  R.ty0=Math.min(R.ty0,py0);R.ty1=Math.max(R.ty1,py0+ph);
}

/* ================= painted surfaces ================= */
// Every close-up texture is painted here in code when the game starts: bark, leaves, planks, roof tiles, stone, the grain of the
// ground and the ripples on the sea. They all tile, so the noise underneath has to wrap.
const WR=[0,0,0];
function pn(x,y,px,py,s){
  const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const xx=((xi%px)+px)%px,yy=((yi%py)+py)%py,x0=xx+s*57,x1=(xx+1)%px+s*57,y0=yy+s*131,y1=(yy+1)%py+s*131;
  const a=h2(x0,y0),b=h2(x1,y0),c=h2(x0,y1),d=h2(x1,y1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
function pf(u,v,px,py,o,s){let t=0,a=.5,m=0;for(let i=0;i<o;i++){t+=a*pn(u*px,v*py,px,py,s+i);m+=a;a*=.5;px*=2;py*=2;}return t/m;}
// wrapping cell noise: distance to the nearest point, that cell's own random number, and how close the runner-up is
function pw(u,v,p,s){
  const x=u*p,y=v*p,xi=Math.floor(x),yi=Math.floor(y);let d1=9,d2=9,id=0;
  for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const cx=xi+i,cy=yi+j,wx=((cx%p)+p)%p+s*17,wy=((cy%p)+p)%p+s*29;
    const d=Math.hypot(cx+h2(wx,wy)-x,cy+h2(wx+7,wy+3)-y);
    if(d<d1){d2=d1;d1=d;id=h2(wx+5,wy+11);}else if(d<d2)d2=d;}
  WR[0]=d1;WR[1]=id;WR[2]=d2-d1;return WR;

    const hit=pickGround(x,y);if(!hit)return;const wx=hit[0],wy=hit[1];R.ghost={x:wx,y:wy};
    const tx=Math.floor(wx),ty=Math.floor(wy);if(tx<0||ty<0||tx>=W||ty>=H)return;const i=ty*W+tx;
    if(tool==='raise'||tool==='lower'){const t=performance.now();if(first||t-g.last>55){g.last=t;sculpt(wx,wy,tool==='raise'?1:-1);}}
    else if(tool==='grow'){if(i!==g.lastI){g.lastI=i;growAt(i);}}
    else if(tool==='clear'){if(i!==g.lastI){g.lastI=i;clearAt(i);}}
    else if(tool==='rain'&&first){if(spend(15)){makeRain(wx,wy);awe(wx,wy,6,'wow');}}
  }
  function tap(x,y){
    const hit=pickGround(x,y);
    if(tool==='build'&&buildType){
      if(!hit)return;const d=BD[buildType],gx=Math.floor(hit[0]-d.w/2+.5),gy2=Math.floor(hit[1]-d.h/2+.5),err=canPlace(buildType,gx,gy2);
      if(err)return toast(err);
      if(!canAfford(buildType)){const nw=G.res.wood<(d.cost.wood||0);flash(nw?'pWood':'pStone');return toast((nw?'wood':'stone')+' cross');}
      placeBuilding(buildType,gx,gy2);fxAdd(gx+d.w/2,gy2+d.h/2,'spark',6);awe(gx+d.w/2,gy2+d.h/2,6,'faith');return;
    }
    let best=null,bd=34;
    for(const v of G.villagers){if(v.inside)continue;const p=project(v.x,gy(v.x,v.y)+.35,v.y);if(!p)continue;const dd=Math.hypot(p[0]-x,p[1]-y);if(dd<bd){bd=dd;best=v;}}
    if(best){if(!best.asleep)say(best,'hand',2,true);return select({v:best});}
    for(const a of G.animals){const p=project(a.x,gy(a.x,a.y)+.2,a.y);if(p&&Math.hypot(p[0]-x,p[1]-y)<26)return select({a});}
    for(const b of G.buildings){if(b.type==='farm')continue;const d=BD[b.type],p=project(b.x+d.w/2,gy(b.x+d.w/2,b.y+d.h/2)+.6,b.y+d.h/2);
      if(p&&Math.hypot(p[0]-x,p[1]-y)<ch/(2*TANH*p[2])*d.w*.6)return select({b});}
    if(!hit)return select(null);
    const tx=Math.floor(hit[0]),ty=Math.floor(hit[1]);if(tx<0||ty<0||tx>=W||ty>=H)return select(null);
    const i=ty*W+tx;if(G.bld[i]&&bById[G.bld[i]])return select({b:bById[G.bld[i]]});
    select({i});
  }
  // dragging moves the map exactly with the finger; letting go mid-swipe lets it glide on
  function panBy(x0,y0,x1,y1){const a=pickPlane(x0,y0),b=pickPlane(x1,y1);if(!a||!b)return;
    const dx=a[0]-b[0],dy=a[1]-b[1],t=performance.now(),dt=clamp((t-g.lt)/1000,.004,.1);g.lt=t;
    G.cam.x+=dx;G.cam.y+=dy;applyCam();CV.x=lerp(CV.x,dx/dt,.55);CV.y=lerp(CV.y,dy/dt,.55);}
  cv.addEventListener('pointerdown',e=>{
    if(mode!=='play')return;
    cv.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY});CV.x=CV.y=0;CV.zt=0;
    if(P.size===1){
      const pan=e.button===1||e.button===2||!brush();
      g={sx:e.clientX,sy:e.clientY,t:performance.now(),lt:performance.now(),moved:false,pan,multi:false,last:0,lastI:-1,slop:e.pointerType==='mouse'?6:11};
      CV.drag=pan;if(!pan)stroke(e.clientX,e.clientY,true);
    }else if(P.size===2&&g){const a=[...P.values()];g.multi=true;g.pan=true;CV.drag=true;g.pd=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);g.mx=(a[0].x+a[1].x)/2;g.my=(a[0].y+a[1].y)/2;}
  });
  cv.addEventListener('pointermove',e=>{
    if(mode!=='play')return;
    const p=P.get(e.pointerId);
    if(!p){if(e.pointerType==='mouse'&&tool!=='hand'){const h=pickGround(e.clientX,e.clientY);R.ghost=h?{x:h[0],y:h[1]}:null;}return;}
    const px=p.x,py=p.y;p.x=e.clientX;p.y=e.clientY;if(!g)return;
    if(P.size>=2){const a=[...P.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),mx=(a[0].x+a[1].x)/2,my=(a[0].y+a[1].y)/2;
      panBy(g.mx,g.my,mx,my);zoomAt(mx,my,(g.pd||d)/Math.max(d,1));g.pd=d;g.mx=mx;g.my=my;return;}
    if(Math.hypot(e.clientX-g.sx,e.clientY-g.sy)>g.slop)g.moved=true;
    if(g.pan){if(g.moved&&!g.multi)panBy(px,py,e.clientX,e.clientY);}
    else if(!g.multi)stroke(e.clientX,e.clientY,false);
  });
  const up=e=>{
    if(!P.has(e.pointerId))return;P.delete(e.pointerId);
    if(P.size===0&&g){if(g.pan&&!g.moved&&!g.multi&&performance.now()-g.t<450&&e.type==='pointerup'&&e.button===0)tap(e.clientX,e.clientY);
      if(!g.moved||g.multi||performance.now()-g.lt>90)CV.x=CV.y=0;
      else{const sp=Math.hypot(CV.x,CV.y),mx=G.cam.d*3.5;if(sp>mx){CV.x*=mx/sp;CV.y*=mx/sp;}}
      CV.drag=false;if(e.pointerType!=='mouse')R.ghost=null;g=null;}
  };
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  cv.addEventListener('contextmenu',e=>e.preventDefault());
  cv.addEventListener('wheel',e=>{e.preventDefault();if(mode!=='play')return;
    const dy=e.deltaY*(e.deltaMode===1?33:1)*(e.ctrlKey?.008:.0016);   // ctrl+wheel is a trackpad pinch
    CV.zt=clamp((CV.zt||G.cam.d)*Math.exp(dy),7,dMax());CV.zx=e.clientX;CV.zy=e.clientY;},{passive:false});
  const key=e=>e.key.length===1?e.key.toLowerCase():e.key;
  addEventListener('keydown',e=>{if(mode!=='play'){if(e.key==='Enter')startPlay();return;}if(e.metaKey||e.ctrlKey||e.altKey)return;
    KEYS[key(e)]=1;const n=parseInt(e.key,10);if(n>=1&&n<=TOOLS.length)setTool(TOOLS[n-1].id);
    if(e.key===' '){e.preventDefault();G.speed=G.speed?0:1;syncUI();}if(e.key==='Escape'){setTool('hand');select(null);}});
  addEventListener('keyup',e=>{KEYS[key(e)]=0;});
  addEventListener('blur',()=>{for(const k in KEYS)KEYS[k]=0;});
  addEventListener('resize',()=>{resize();applyCam();});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play')save();});
  addEventListener('pagehide',()=>{if(mode==='play')save();});
  document.addEventListener('gesturestart',e=>e.preventDefault());
}
const KEYS={};
function zoomAt(x,y,k){const a=pickPlane(x,y);G.cam.d*=k;applyCam();const b=pickPlane(x,y);if(a&&b){G.cam.x+=a[0]-b[0];G.cam.y+=a[1]-b[1];applyCam();}}

/* ================= main loop ================= */
let lastT=0,hudT=0,saveT=0;
// If the device cannot hold 30 frames a second the picture is made cheaper, a step at a time: sharpness first, then the detailed
// models and the grass tufts, then real shadows.
// Open the page with #hq to keep full quality regardless.
let QL=0,slowN=0,ema=16;
function govern(real){
  if(QL>=3||location.hash==='#hq')return;
  ema=lerp(ema,real*1000,.05);slowN=ema>34?slowN+1:Math.max(0,slowN-2);
  if(slowN<100)return;
  slowN=0;ema=16;
  do QL++;while(QL<2&&[2,1.5,1][QL]>=(window.devicePixelRatio||1));
  if(QL>=3){QL=3;SHOK=false;R.meshNow=true;}
  resize();applyCam();
}
function frame(t){
  requestAnimationFrame(frame);
  const real=Math.min(.1,(t-lastT)/1000||0);lastT=t;now=t/1000;govern(real);
  if(mode==='play'){
    // keys ease in and out; a released swipe coasts to a stop; the wheel zooms towards the pointer
    const k=KEYS,sp=G.cam.d*1.1,ke=1-Math.exp(-real*9);
    CV.kx=lerp(CV.kx,((k.ArrowRight||k.d?1:0)-(k.ArrowLeft||k.a?1:0))*sp,ke);CV.ky=lerp(CV.ky,((k.ArrowDown||k.s?1:0)-(k.ArrowUp||k.w?1:0))*sp,ke);
    if(Math.abs(CV.kx)+Math.abs(CV.ky)>.01){G.cam.x+=CV.kx*real;G.cam.y+=CV.ky*real;}
    if(!CV.drag&&(CV.x||CV.y)){G.cam.x+=CV.x*real;G.cam.y+=CV.y*real;const fr=Math.exp(-real*5);CV.x*=fr;CV.y*=fr;if(Math.hypot(CV.x,CV.y)<G.cam.d*.02)CV.x=CV.y=0;}
    const zk=(k['-']||k._?1:0)-(k['=']||k['+']?1:0);if(zk){CV.zt=clamp((CV.zt||G.cam.d)*Math.exp(zk*real*1.8),7,dMax());CV.zx=cw/2;CV.zy=ch/2;}
    applyCam();
    if(CV.zt){const r=CV.zt/G.cam.d;if(Math.abs(Math.log(r))<.002)CV.zt=0;else zoomAt(CV.zx,CV.zy,Math.pow(r,1-Math.exp(-real*13)));}
    let dt=real*G.speed;while(dt>0){const s=Math.min(dt,.1);step(s);dt-=s;}
    if(trans>0){trans-=real;const q=1-Math.exp(-real*4.5);view.x=lerp(view.x,G.cam.x,q);view.z=lerp(view.z,G.cam.y,q);view.d=lerp(view.d,G.cam.d,q);view.yaw=lerp(view.yaw,0,q);view.pitch=lerp(view.pitch,pitchFor(G.cam.d),q);}
    else{view.x=G.cam.x;view.z=G.cam.y;view.d=G.cam.d;view.yaw=0;view.pitch=pitchFor(view.d);}
    view.ty=lerp(view.ty,Math.max(0,gy(G.cam.x,G.cam.y))*clamp((64-G.cam.d)/40,0,1),1-Math.exp(-real*4));
    hudT-=real;if(hudT<=0){hudT=.25;updHUD();}
    saveT+=real;if(saveT>12){saveT=0;save();}
  }else{
    const q=1-Math.exp(-real*2.5);view.x=lerp(view.x,W/2,q);view.z=lerp(view.z,H/2,q);view.d=lerp(view.d,dMax()*.62,q);view.pitch=lerp(view.pitch,.5,q);view.ty=lerp(view.ty,0,q);view.yaw+=real*.16;
  }
  camBasis();render(real);
}
function boot(){
  if(!gl){document.body.classList.remove('title');document.body.innerHTML='<div style="position:fixed;inset:0;display:grid;place-items:center"><svg width="96" height="96" viewBox="0 0 24 24">'+icWrap(IC.no)+'</svg></div>';return;}
  initIcons();initGL();resize();
  savedExists=load();if(!savedExists){newGame(0);preview=true;}
  resize();clampCam();initUI();syncUI();titleUI();
  window.KV={get G(){return G;},get R(){return R;},step,save,newGame,sim(days){const n=Math.round(days*DAY/.1);for(let i=0;i<n;i++)step(.1);}};
  requestAnimationFrame(frame);
}
boot();
</script>
