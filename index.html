<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1c62a8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>KV Island</title>
<style>
:root{
  --panel:rgba(22,34,48,.8); --line:rgba(255,255,255,.16);
  --fg:#f3efe2; --dim:#a9b7c2; --accent:#f2c14e; --good:#7fd08a; --bad:#ef7b6c;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1c62a8;color:var(--fg);
  font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#o{pointer-events:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
[hidden]{display:none!important}
.ui{transition:opacity .4s}
body.title .ui{opacity:0;pointer-events:none!important}
body.title .ui *{pointer-events:none!important}

#hud{position:fixed;top:0;left:0;right:0;display:flex;gap:6px;align-items:flex-start;
  padding:calc(6px + var(--sat)) calc(8px + var(--sar)) 6px calc(8px + var(--sal));pointer-events:none}
#stats{display:flex;flex-wrap:wrap;gap:5px;flex:1;min-width:0;pointer-events:auto}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 9px;font-size:14px;white-space:nowrap;
  font-variant-numeric:tabular-nums;font-weight:700;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pill.low{color:var(--bad)}
.pill.flash{animation:flash .5s}
@keyframes flash{30%{background:#8c2f2a;transform:scale(1.1)}}
.hbtn{pointer-events:auto;flex:none;min-width:42px;height:36px;border-radius:999px;background:var(--panel);
  border:1px solid var(--line);font-weight:700;padding:0 10px;font-size:15px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hbtn:active{background:#2c4258}

#toasts{position:fixed;top:calc(84px + var(--sat));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--line);padding:5px 14px;border-radius:999px;font-size:22px;font-weight:700;
  animation:tin .3s cubic-bezier(.3,1.6,.5,1);transition:opacity .5s}
@keyframes tin{from{transform:scale(.4);opacity:0}}

#bottom{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:6px;
  padding:0 calc(6px + var(--sar)) calc(6px + var(--sab)) calc(6px + var(--sal));pointer-events:none}
#bottom>*{pointer-events:auto}
#info{align-self:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:8px 44px 8px 12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);position:relative;
  display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:20px;max-width:100%}
#info .big{font-size:30px;line-height:1}
#info .x{position:absolute;top:2px;right:2px;width:38px;height:38px;font-size:18px;color:var(--dim)}
#info .num{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.bar{display:inline-block;width:54px;height:8px;border-radius:4px;background:rgba(255,255,255,.16);vertical-align:middle;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
.act{background:#4a2b2a;border:1px solid #8a4640;border-radius:10px;padding:3px 12px;font-size:20px}
.row{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;background:var(--panel);border:1px solid var(--line);
  border-radius:18px;padding:5px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);touch-action:pan-x}
.row::-webkit-scrollbar{display:none}
.tb{flex:1 0 auto;min-width:42px;height:54px;padding:2px;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:1px solid transparent;position:relative}
.tb .e{font-size:26px;line-height:1.1}
.tb small{font-size:10px;font-weight:700;white-space:nowrap;color:var(--dim);line-height:1.1;font-variant-numeric:tabular-nums}
.tb.on{background:rgba(242,193,78,.2);border-color:var(--accent)}
.tb.on small{color:var(--fg)}
.tb.cant{opacity:.4}
#buildbar .tb{min-width:58px;height:58px}

/* title screen */
#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:calc(9vh + var(--sat)) 16px calc(8vh + var(--sab));pointer-events:none;transition:opacity .5s;
  background:radial-gradient(ellipse at 50% 55%,rgba(8,30,60,0) 35%,rgba(8,30,60,.55) 100%)}
body:not(.title) #title{opacity:0;visibility:hidden;transition:opacity .5s,visibility 0s .5s}
#title h1{margin:0;display:flex;flex-wrap:wrap;justify-content:center;gap:0 .32em;
  font:900 clamp(46px,15vw,104px)/1 ui-rounded,"Arial Rounded MT Bold","Varela Round","Nunito",system-ui,sans-serif;letter-spacing:.01em}
#title h1 span{display:inline-flex}
#title h1 b{display:inline-block;color:#fff6d8;-webkit-text-stroke:.05em #123a63;paint-order:stroke fill;
  text-shadow:0 .07em 0 #123a63,0 .13em 0 rgba(10,30,55,.45);animation:hop 2.4s cubic-bezier(.4,0,.3,1) infinite;animation-delay:calc(var(--i)*.11s)}
#title h1 b:nth-child(odd){color:#ffd76a}
@keyframes hop{0%,55%,100%{transform:translateY(0) rotate(0)}12%{transform:translateY(-.26em) rotate(-7deg)}24%{transform:translateY(0) rotate(4deg)}32%{transform:translateY(-.08em) rotate(0)}40%{transform:translateY(0)}}
#sky{position:absolute;inset:0;overflow:hidden}
#sky i{position:absolute;font-style:normal;font-size:clamp(34px,9vw,64px);left:-20%;animation:drift linear infinite;opacity:.92;filter:drop-shadow(0 6px 6px rgba(10,30,55,.25))}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(150vw)}}
#tBtns{display:flex;gap:18px;align-items:center;pointer-events:auto}
.big{font-size:34px}
.tbtn{width:74px;height:74px;border-radius:50%;background:var(--panel);border:2px solid var(--line);font-size:34px;line-height:1;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 8px 20px rgba(8,25,50,.35);transition:transform .12s}
.tbtn:active{transform:scale(.9)}
#tPlay{width:98px;height:98px;background:var(--accent);border-color:#fff3c4;font-size:44px;color:#3a2a06;padding-left:8px;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 8px 34px rgba(255,210,90,.65)}}
#tRoll.spin{animation:spin .5s}
@keyframes spin{to{transform:rotate(360deg)}}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){#title h1 b,#tPlay,#sky i{animation:none}}
</style>
</head>
<body class="title">
<canvas id="c"></canvas>
<canvas id="o"></canvas>

<div id="hud" class="ui">
  <div id="stats">
    <div class="pill" id="pDay">☀️ 1</div>
    <div class="pill" id="pPop">👥 0</div>
    <div class="pill" id="pWood">🪵 0</div>
    <div class="pill" id="pFood">🍎 0</div>
    <div class="pill" id="pStone">🪨 0</div>
    <div class="pill" id="pFaith">✨ 0</div>
  </div>
  <button class="hbtn" id="bSpeed" aria-label="Game speed">▶</button>
  <button class="hbtn" id="bMenu" aria-label="Title screen">☰</button>
</div>
<div id="toasts" class="ui"></div>

<div id="bottom" class="ui">
  <div id="info" hidden></div>
  <div class="row" id="buildbar" hidden></div>
  <div class="row" id="toolbar"></div>
</div>

<div id="title">
  <div id="sky" aria-hidden="true">
    <i style="top:14%;animation-duration:38s;animation-delay:-6s">☁️</i>
    <i style="top:30%;animation-duration:55s;animation-delay:-30s;font-size:30px">☁️</i>
    <i style="top:22%;animation-duration:24s;animation-delay:-11s;font-size:26px">🕊️</i>
    <i style="top:68%;animation-duration:70s;animation-delay:-50s">⛵</i>
  </div>
  <h1 aria-label="KV Island"><span><b style="--i:0">K</b><b style="--i:1">V</b></span><span><b style="--i:2">I</b><b style="--i:3">s</b><b style="--i:4">l</b><b style="--i:5">a</b><b style="--i:6">n</b><b style="--i:7">d</b></span></h1>
  <div id="tBtns">
    <button class="tbtn" id="tBack" aria-label="Back to saved island" hidden>↩️</button>
    <button class="tbtn" id="tPlay" aria-label="Play">▶</button>
    <button class="tbtn" id="tNew" aria-label="New island" hidden>🏝️</button>
    <button class="tbtn" id="tRoll" aria-label="Another island" hidden>🎲</button>
  </div>
</div>

<script>
'use strict';
/* ================= constants ================= */
const W=64,H=64,N=W*H,DAY=120,TX=8,MAXPOP=90,ADULT=3;
const DEEP=0.26,SEA=0.36,SAND=0.41,HILL=0.68,ROCK=0.80,SNOW=0.92;
const O_NONE=0,O_TREE=1,O_BUSH=2,O_ROCK=3,O_FLOWER=4,O_CROP=5,O_GRAVE=6;
const SAVE_KEY='kvisland.save.v2';
const EMO='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const BD={
  house:{name:'House',e:'🏠',w:2,h:2,cost:{wood:10},work:14,desc:'Home for 4. Families grow here.'},
  farm:{name:'Farm',e:'🌾',w:3,h:3,cost:{wood:5},work:8,walk:true,desc:'Crops grow faster on wet soil.'},
  store:{name:'Storehouse',e:'📦',w:2,h:2,cost:{wood:15},work:16,desc:'+80 storage, a place to drop goods.'},
  well:{name:'Well',e:'⛲',w:1,h:1,cost:{wood:2,stone:5},work:8,desc:'Keeps nearby soil moist.'},
  hut:{name:'Fishing hut',e:'🎣',w:1,h:1,cost:{wood:8},work:8,desc:'Must touch water. Steady food.'},
  coop:{name:'Chicken coop',e:'🐔',w:1,h:1,cost:{wood:8},work:8,desc:'Chickens lay eggs to collect.'},
  shrine:{name:'Shrine',e:'⛩️',w:2,h:2,cost:{wood:8,stone:12},work:18,desc:'Prayer brings faith and joy.'},
  fire:{name:'Campfire',e:'🔥',w:1,h:1,cost:{wood:3},work:3,desc:'Gathering spot and drop-off.'},
};
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, rnd=Math.random;
const ri=n=>Math.floor(rnd()*n), pick=a=>a[ri(a.length)];
const terr=h=>h<DEEP?0:h<SEA?1:h<SAND?2:h<HILL?3:h<ROCK?4:5;
const TNAME=['Deep water','Shallows','Beach','Grassland','Hills','Mountain'];
function h2(x,y){let n=Math.imul(x,374761393)^Math.imul(y,668265263);n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967296;}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ================= state ================= */
let G=null;            // saved game state
let R=null;            // runtime-only state
const walk=new Uint8Array(N),nearWater=new Uint8Array(N),rockAdj=new Uint8Array(N),nearFire=new Uint8Array(N),
      dropAdj=new Uint8Array(N),wellNear=new Uint8Array(N),claims=new Int32Array(N),qv=new Uint8Array(N);
let bById={};
function freshR(){
  R={slow:0,elderT:1,sleep:false,pop:0,cap:60,trees:0,dry:false,want:null,fail:{},emptyT:0,clock:0,
     sel:null,fx:[],ripples:[],birds:[],dirty:null,lastTerr:0,hasShrine:false,sites:0,ghost:null,infoT:0,rise:1,meshNow:true,meshT:0,hDirty:true,texDirty:true};
  for(let i=0;i<3;i++)R.birds.push({x:rnd()*W,y:rnd()*H,vx:(rnd()<.5?-1:1)*(1.2+rnd()),vy:(rnd()-.5)*1.2,n:2+ri(4)});
  claims.fill(0);
}

/* ================= generation ================= */
function islandName(seed){
  const r=mulberry(seed^0x9e3779b9),A=['Ka','Lo','Mi','Ta','Ru','Ne','Si','Po','Ha','Vi','Be','Do','Yu','Ze','A','O','Ma','Wai','Ku','Pe'],
    B=['la','ni','ko','ra','mi','to','sa','wen','li','ru','na','hoa','ki','va'],C=['Isle','Atoll','Island','Cay','Haven','Rock'];
  let s=A[Math.floor(r()*A.length)]+B[Math.floor(r()*B.length)];if(r()<.5)s+=B[Math.floor(r()*B.length)];
  return s+' '+C[Math.floor(r()*C.length)];
}
function personName(){
  const A=['Ka','Lo','Mi','Ta','Ru','Ne','Si','Po','Ha','Vi','Be','Do','Yu','Ze','Ani','Olu','Ema','Tem','Nor','Ila','Fen','Gar'],
    B=['la','ni','ko','ra','mi','to','sa','wen','li','ru','na','ki','','','ro','vi'];
  return pick(A)+pick(B);
}
function generate(seed){
  const hash=(x,y,s)=>{let n=Math.imul(x,374761393)^Math.imul(y,668265263)^Math.imul(s+seed|0,1442695041);n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967296;};
  const noise=(x,y,s)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    const a=hash(xi,yi,s),b=hash(xi+1,yi,s),c=hash(xi,yi+1,s),d=hash(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;};
  const fbm=(x,y,o,s)=>{let t=0,a=.5,f=1,m=0;for(let i=0;i<o;i++){t+=a*noise(x*f,y*f,s+i*7);m+=a;a*=.5;f*=2;}return t/m;};
  const r=mulberry(seed);
  const sx=.85+r()*.3,sy=.85+r()*.3,ox=(r()-.5)*.16,oy=(r()-.5)*.16;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const nx=((x+.5)/W*2-1-ox)/sx,ny=((y+.5)/H*2-1-oy)/sy;
    const warp=fbm(nx*1.6+9,ny*1.6+9,3,11)-.5;
    const d=Math.hypot(nx,ny)*(1+warp*1.1);
    const e=fbm(nx*2.4+3,ny*2.4+7,5,1);
    const ridge=Math.max(0,fbm(nx*1.3+20,ny*1.3+20,3,31)-.5);
    let hh=.41+(e-.5)*1.25+ridge*.9+.24*(1-Math.pow(d/.74,2.4));
    const ed=Math.min(x,y,W-1-x,H-1-y);
    if(ed<8)hh-=(8-ed)*.06;
    if(ed<5)hh=Math.min(hh,SEA-.05);
    G.h[y*W+x]=clamp(hh,.04,.98);
  }
  keepLargest();
  for(let i=0;i<N;i++){
    const x=i%W,y=(i/W)|0,t=terr(G.h[i]),f=fbm(x*.11+50,y*.11+50,3,71),q=r();
    G.moist[i]=.4;G.obj[i]=0;G.grow[i]=0;
    if(t===3||t===4){
      if((f>.54&&q<.62)||q<.03){G.obj[i]=O_TREE;G.grow[i]=.45+r()*.55;}
      else if(q<.065){G.obj[i]=O_BUSH;G.grow[i]=.4+r()*.6;}
      else if(q<.11){G.obj[i]=O_FLOWER;G.grow[i]=1;}
      else if(q<(t===4?.2:.125)){G.obj[i]=O_ROCK;G.grow[i]=1;}
    }else if(t===2&&q<.015){G.obj[i]=O_ROCK;G.grow[i]=1;}
  }
}
function keepLargest(){
  const lab=new Int32Array(N),st=[];let best=0,bn=0,c=0;
  for(let s0=0;s0<N;s0++){if(lab[s0]||G.h[s0]<SEA)continue;c++;let n=0;st.push(s0);lab[s0]=c;
    while(st.length){const i=st.pop(),x=i%W,y=(i/W)|0;n++;
      for(const j of [x>0?i-1:-1,x<W-1?i+1:-1,y>0?i-W:-1,y<H-1?i+W:-1])if(j>=0&&!lab[j]&&G.h[j]>=SEA){lab[j]=c;st.push(j);}}
    if(n>bn){bn=n;best=c;}}
  for(let i=0;i<N;i++)if(lab[i]&&lab[i]!==best)G.h[i]=SEA-.04-h2(i,7)*.03;
}
function landStats(){let land=0;for(let i=0;i<N;i++){const t=terr(G.h[i]);if(t>=2&&t<=4)land++;}return land/N;}
function newGame(seedIn){
  let seed=(seedIn>>>0)||((rnd()*4294967295)>>>0)||1;
  for(let tries=0;tries<12;tries++){
    G={v:1,seed,name:islandName(seed),time:.3,dayNum:0,h:new Float32Array(N),moist:new Float32Array(N),wear:new Float32Array(N),
      obj:new Uint8Array(N),grow:new Float32Array(N),bld:new Int32Array(N),buildings:[],villagers:[],animals:[],clouds:[],
      res:{wood:20,food:25,stone:0},faith:60,nextId:1,stats:{births:0,deaths:0,maxPop:0,built:0},auto:true,speed:1,
      cam:{x:W/2,y:H/2,d:0},nextRain:1.2+rnd()*1.5,helped:false};
    generate(seed);
    const lf=landStats();
    if(lf>.17&&lf<.5)break;
    seed=(seed+1)>>>0;
  }
  freshR();bById={};
  // pick the village site
  let best=-1,bs=-1e9;
  for(let y=6;y<H-6;y++)for(let x=6;x<W-6;x++){
    const i=y*W+x;if(terr(G.h[i])!==3)continue;
    let s=0;for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const j=(y+dy)*W+x+dx,t=terr(G.h[j]);
      s+=t===3?1:t===4?.3:-1.2;if(G.obj[j]===O_TREE)s+=.25;}
    s-=Math.hypot(x-W/2,y-H/2)*.25;s+=h2(x+seed,y)*2;
    if(s>bs){bs=s;best=i;}
  }
  if(best<0)for(let i=0;i<N;i++)if(terr(G.h[i])>=2&&terr(G.h[i])<=4){best=i;break;}
  const fx=best%W,fy=(best/W)|0;
  for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const j=(fy+dy)*W+fx+dx;if(G.obj[j]===O_TREE||G.obj[j]===O_ROCK)G.obj[j]=0;}
  const b=addBuilding('fire',fx,fy);b.done=true;b.prog=BD.fire.work;
  refreshLogic();
  for(let k=0;k<5;k++){const v=makeVillager(fx+.5+(rnd()-.5)*3,fy+1.5+rnd()*1.5,4+rnd()*12);G.villagers.push(v);}
  let placed=0;for(let k=0;k<400&&placed<7;k++){const i=ri(N);if(terr(G.h[i])===3&&!G.bld[i]&&Math.hypot(i%W-fx,((i/W)|0)-fy)>6){
    G.animals.push({t:'sheep',x:i%W+.5,y:((i/W)|0)+.5,tx:0,ty:0,w:rnd()*3,d:1,mv:false});placed++;}}
  G.cam.x=fx+.5;G.cam.y=fy+.5;G.cam.d=0;
  fullDirty();R.rise=0;
}
function makeVillager(x,y,age){
  return {id:G.nextId++,name:personName(),x,y,age,life:38+rnd()*22,hunger:.7+rnd()*.3,health:1,happy:.6,home:0,carry:null,
    c:ri(8),sk:ri(4),hr:ri(5),task:null,idle:rnd()*2,sayT:4+rnd()*10,bub:null,look:0,pause:0,dir:1,walk:0,asleep:false,inside:false,
    jx:(rnd()-.5)*.36,jy:(rnd()-.5)*.36,awe:0,ang:0};
}

/* ================= logic caches ================= */
function refreshLogic(){
  R.meshNow=true;
  bById={};for(const b of G.buildings)bById[b.id]=b;
  let stores=0;R.hasShrine=false;R.sites=0;
  for(let i=0;i<N;i++){
    const t=terr(G.h[i]);let w=t>=2&&t<=4;
    if(w&&G.bld[i]){const b=bById[G.bld[i]];if(b&&!BD[b.type].walk)w=false;}
    walk[i]=w?1:0;
  }
  nearWater.fill(0);rockAdj.fill(0);nearFire.fill(0);dropAdj.fill(0);wellNear.fill(0);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const i=y*W+x,t=terr(G.h[i]);
    if(t<2){for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const xx=x+dx,yy=y+dy;if(xx>=0&&yy>=0&&xx<W&&yy<H)nearWater[yy*W+xx]=1;}}
    else if(t===5){if(x>0)rockAdj[i-1]=1;if(x<W-1)rockAdj[i+1]=1;if(y>0)rockAdj[i-W]=1;if(y<H-1)rockAdj[i+W]=1;}
  }
  for(const b of G.buildings){
    const d=BD[b.type];
    if(!b.done){R.sites++;continue;}
    if(b.type==='store')stores++;
    if(b.type==='shrine')R.hasShrine=true;
    const rad=b.type==='well'?4:b.type==='fire'?2:0;
    if(rad)for(let dy=-rad;dy<=rad;dy++)for(let dx=-rad;dx<=rad;dx++){const xx=b.x+dx,yy=b.y+dy;
      if(xx>=0&&yy>=0&&xx<W&&yy<H){if(b.type==='well')wellNear[yy*W+xx]=1;else nearFire[yy*W+xx]=1;}}
    if(b.type==='store'||b.type==='fire')for(let dy=-1;dy<=d.h;dy++)for(let dx=-1;dx<=d.w;dx++){
      if((dx===-1||dx===d.w)&&(dy===-1||dy===d.h))continue;
      const xx=b.x+dx,yy=b.y+dy;if(xx>=0&&yy>=0&&xx<W&&yy<H)dropAdj[yy*W+xx]=1;}
  }
  R.cap=60+80*stores;
}
function markDirty(x,y){const d=R.dirty;if(!d)R.dirty={x0:x,y0:y,x1:x,y1:y};else{if(x<d.x0)d.x0=x;if(y<d.y0)d.y0=y;if(x>d.x1)d.x1=x;if(y>d.y1)d.y1=y;}}
function fullDirty(){R.dirty={x0:0,y0:0,x1:W-1,y1:H-1};R.lastTerr=0;R.hDirty=true;}

/* ================= pathfinding ================= */
const qbuf=new Int32Array(N),prev=new Int32Array(N),stamp=new Uint32Array(N);let stampC=0;
const DX=[1,-1,0,0,1,1,-1,-1],DY=[0,0,1,-1,1,-1,1,-1];
function bfs(start,goal,maxN){
  maxN=maxN||N;stampC++;let qh=0,qt=0;qbuf[qt++]=start;stamp[start]=stampC;prev[start]=-1;
  while(qh<qt){
    const c=qbuf[qh++];
    if(goal(c)){const p=[];let k=c;while(k>=0){p.push(k);k=prev[k];}p.reverse();return p;}
    if(qh>maxN)break;
    const cx=c%W,cy=(c/W)|0;
    for(let k=0;k<8;k++){
      const nx=cx+DX[k],ny=cy+DY[k];if(nx<0||ny<0||nx>=W||ny>=H)continue;
      const ni=ny*W+nx;if(stamp[ni]===stampC||!walk[ni])continue;
      if(k>=4&&(!walk[cy*W+nx]||!walk[ny*W+cx]))continue;
      stamp[ni]=stampC;prev[ni]=c;qbuf[qt++]=ni;
    }
  }
  return null;
}
function adjBld(i,test){
  const x=i%W,y=(i/W)|0;let b;
  if(x>0&&(b=G.bld[i-1])&&test(b))return b;if(x<W-1&&(b=G.bld[i+1])&&test(b))return b;
  if(y>0&&(b=G.bld[i-W])&&test(b))return b;if(y<H-1&&(b=G.bld[i+W])&&test(b))return b;return 0;
}
function nearestWalk(x,y){
  for(let r=1;r<24;r++){let best=-1,bd=1e9;
    for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;
      const xx=x+dx,yy=y+dy;if(xx<0||yy<0||xx>=W||yy>=H)continue;const i=yy*W+xx;
      if(walk[i]){const d=dx*dx+dy*dy;if(d<bd){bd=d;best=i;}}}
    if(best>=0)return best;}
  return -1;
}

/* ================= buildings ================= */
function canPlace(type,x,y,margin){
  const d=BD[type];let water=false;
  if(x<1||y<1||x+d.w>W-1||y+d.h>H-1)return '🚫';
  for(let dy=0;dy<d.h;dy++)for(let dx=0;dx<d.w;dx++){
    const i=(y+dy)*W+x+dx,t=terr(G.h[i]);
    if(t<2)return '🚫 🌊';if(t>4)return '🚫 ⛰️';if(G.bld[i])return '🚫 🏠';
    if(type==='farm'&&t===2)return '🌾 🚫 🏖️';
  }
  if(margin)for(let dy=-1;dy<=d.h;dy++)for(let dx=-1;dx<=d.w;dx++){const i=(y+dy)*W+x+dx;if(G.bld[i]||terr(G.h[i])<2)return 'x';}
  if(type==='hut'){for(let dy=-1;dy<=d.h;dy++)for(let dx=-1;dx<=d.w;dx++){if(terr(G.h[(y+dy)*W+x+dx])<2)water=true;}
    if(!water)return '🎣 ➡️ 🌊';}
  return '';
}
function canAfford(type){const c=BD[type].cost;for(const k in c)if(G.res[k]<c[k])return false;return true;}
function addBuilding(type,x,y){
  const d=BD[type],b={id:G.nextId++,type,x,y,done:false,prog:0,eggs:0,users:0,v:ri(1000)};
  let m=0;for(let dy=0;dy<d.h;dy++)for(let dx=0;dx<d.w;dx++)m+=G.h[(y+dy)*W+x+dx];m=clamp(m/(d.w*d.h),SEA+.012,ROCK-.01);
  for(let dy=0;dy<d.h;dy++)for(let dx=0;dx<d.w;dx++){const i=(y+dy)*W+x+dx;G.h[i]=m;G.bld[i]=b.id;G.obj[i]=0;G.grow[i]=0;claims[i]=0;}
  markDirty(x-1,y-1);markDirty(x+d.w,y+d.h);R.hDirty=true;
  G.buildings.push(b);bById[b.id]=b;return b;
}
function placeBuilding(type,x,y){
  const c=BD[type].cost;for(const k in c)G.res[k]-=c[k];
  const b=addBuilding(type,x,y);refreshLogic();return b;
}
function finishBuilding(b){
  b.done=true;G.stats.built++;const d=BD[b.type];
  if(b.type==='farm')for(let dy=0;dy<d.h;dy++)for(let dx=0;dx<d.w;dx++){const i=(b.y+dy)*W+b.x+dx;G.obj[i]=O_CROP;G.grow[i]=.05;}
  if(b.type==='coop')for(let k=0;k<3;k++)G.animals.push({t:'chicken',x:b.x+.5,y:b.y+1.3,tx:0,ty:0,w:rnd()*2,d:1,mv:false,home:b.id});
  refreshLogic();toast(d.e+' ✅');
  fxAdd(b.x+d.w/2,b.y+d.h/2,'spark',10);
}
function removeBuilding(b,refund){
  const d=BD[b.type];
  for(let dy=0;dy<d.h;dy++)for(let dx=0;dx<d.w;dx++){const i=(b.y+dy)*W+b.x+dx;G.bld[i]=0;G.obj[i]=0;G.grow[i]=0;}
  G.buildings.splice(G.buildings.indexOf(b),1);
  for(const v of G.villagers){if(v.home===b.id)v.home=0;if(v.task&&v.task.bid===b.id)clearTask(v);}
  G.animals=G.animals.filter(a=>a.home!==b.id);
  if(refund)for(const k in d.cost)G.res[k]=Math.min(R.cap,G.res[k]+Math.floor(d.cost[k]/2));
  refreshLogic();fxAdd(b.x+d.w/2,b.y+d.h/2,'puff',8);
}
function occupants(id){let n=0;for(const v of G.villagers)if(v.home===id)n++;return n;}

/* ================= villagers ================= */
function say(v,e,dur,look){v.bub={e,t:dur||3};if(look){v.look=dur||3;v.pause=Math.max(v.pause,(dur||3)*.8);}}
function clearTask(v){
  const t=v.task;if(!t)return;
  if(t.claim>=0)claims[t.claim]=0;
  if(t.bid){const b=bById[t.bid];if(b&&b.users>0)b.users--;}
  v.task=null;v.asleep=false;v.inside=false;
}
function setTask(v,kind,path,ex){
  const t={kind,path,pi:1,phase:'go',t:0,claim:-1,bid:0};if(ex)Object.assign(t,ex);
  if(t.claim>=0)claims[t.claim]=v.id;
  if(t.bid){const b=bById[t.bid];if(b)b.users++;}
  v.task=t;return true;
}
function tileOf(v){return clamp(Math.floor(v.y),0,H-1)*W+clamp(Math.floor(v.x),0,W-1);}
function tryJob(v,kind,ti){
  let p,found=0;
  switch(kind){
    case 'build':p=bfs(ti,i=>(found=adjBld(i,id=>{const b=bById[id];return b&&!b.done&&b.users<3;}))!==0);
      return p?setTask(v,'build',p,{bid:found}):false;
    case 'crop':p=bfs(ti,i=>G.obj[i]===O_CROP&&G.grow[i]>=1&&!claims[i]);
      return p?setTask(v,'crop',p,{claim:p[p.length-1]}):false;
    case 'berry':p=bfs(ti,i=>G.obj[i]===O_BUSH&&G.grow[i]>=1&&!claims[i],2600);
      return p?setTask(v,'berry',p,{claim:p[p.length-1]}):false;
    case 'wood':p=bfs(ti,i=>G.obj[i]===O_TREE&&G.grow[i]>=.6&&!claims[i]);
      return p?setTask(v,'chop',p,{claim:p[p.length-1]}):false;
    case 'stone':p=bfs(ti,i=>(G.obj[i]===O_ROCK&&!claims[i])||rockAdj[i]);
      if(!p)return false;{const e=p[p.length-1];return setTask(v,'mine',p,{claim:G.obj[e]===O_ROCK?e:-1});}
    case 'fish':p=bfs(ti,i=>(found=adjBld(i,id=>{const b=bById[id];return b&&b.done&&b.type==='hut'&&b.users<2;}))!==0);
      return p?setTask(v,'fish',p,{bid:found}):false;
    case 'eggs':p=bfs(ti,i=>(found=adjBld(i,id=>{const b=bById[id];return b&&b.done&&b.type==='coop'&&b.eggs>=3&&b.users<1;}))!==0);
      return p?setTask(v,'eggs',p,{bid:found}):false;
    case 'pray':p=bfs(ti,i=>(found=adjBld(i,id=>{const b=bById[id];return b&&b.done&&b.type==='shrine';}))!==0&&rnd()<.4,2500);
      return p?setTask(v,'pray',p,{dur:5+rnd()*4}):false;
    case 'social':p=bfs(ti,i=>nearFire[i]&&rnd()<.25,2500);
      return p?setTask(v,'social',p,{dur:3+rnd()*5}):false;
    case 'hunt':{const set=new Set();for(const a of G.animals)if(a.t==='sheep')set.add(Math.floor(a.y)*W+Math.floor(a.x));
      if(!set.size)return false;p=bfs(ti,i=>set.has(i),2500);return p?setTask(v,'hunt',p):false;}
    case 'wander':{const x=clamp(Math.floor(v.x)+ri(11)-5,0,W-1),y=clamp(Math.floor(v.y)+ri(11)-5,0,H-1),g=y*W+x;
      if(!walk[g])return false;p=bfs(ti,i=>i===g,300);return p?setTask(v,'wander',p,{dur:1+rnd()*3}):false;}
  }
  return false;
}
function think(v){
  const ti=tileOf(v),res=G.res,pop=R.pop||1,now=R.clock;
  // mood
  let h=.5;h+=v.hunger>.5?.2:v.hunger<.2?-.3:0;h+=v.home?.15:(v.age>=ADULT?-.15:0);if(R.hasShrine)h+=.1;if(res.food>pop*3)h+=.05;
  v.happy=lerp(v.happy,clamp(h,0,1),.3);
  if(R.sleep){
    let p=null;
    if(v.home&&bById[v.home])p=bfs(ti,i=>adjBld(i,id=>id===v.home)!==0);
    if(p)return setTask(v,'sleep',p,{home:true});
    p=bfs(ti,i=>nearFire[i]&&rnd()<.3,1500);
    return setTask(v,'sleep',p||[ti],{home:false});
  }
  if(v.hunger<.45){
    if(res.food>=1){res.food-=1;v.hunger=Math.min(1,v.hunger+.55);return setTask(v,'eat',[ti],{dur:1.2});}
    if(v.hunger<.35){
      if(tryJob(v,'berry',ti)){v.task.eat=true;return true;}
      if(v.age>=ADULT&&tryJob(v,'hunt',ti))return true;
    }
  }
  if(v.carry){
    const p=bfs(ti,i=>dropAdj[i]===1);
    if(p)return setTask(v,'deliver',p);
    res[v.carry.k]=Math.min(R.cap,res[v.carry.k]+v.carry.n);v.carry=null;
  }
  if(v.age<ADULT)return tryJob(v,rnd()<.4?'social':'wander',ti)||tryJob(v,'wander',ti);
  const w={},crit=res.food<pop,need=res.food<pop*3,cap=R.cap;
  if(R.sites)w.build=crit?2:10;
  if(res.food<cap){const plenty=res.food>pop*8+20;w.crop=plenty?.6:7;w.eggs=plenty?.4:4;w.fish=need?6:plenty?0:1.5;w.berry=need?5:res.food<pop*5?1:0;}
  const wt=Math.min(cap,30+pop*2);
  if(res.wood<wt)w.wood=res.wood<12?8:4;
  if(res.stone<Math.min(cap,20))w.stone=2.5;
  if(R.hasShrine)w.pray=1.3;
  w.social=1;w.wander=.8;
  const order=[];for(const k in w){if(w[k]>0&&!(R.fail[k]>now))order.push([k,Math.pow(rnd(),1/w[k])]);}
  order.sort((a,b)=>b[1]-a[1]);
  for(const [k] of order){if(tryJob(v,k,ti))return true;if(k!=='wander'&&k!=='social'&&k!=='pray')R.fail[k]=now+4;}
  return false;
}
function pickSay(v){
  const res=G.res,pop=R.pop||1,adult=v.age>=ADULT,f=G.time%1;
  if(v.hunger<.3&&res.food<1)return say(v,'🍎',3.2,true);
  if(adult&&!v.home)return say(v,(f>.8||f<.25)?'🥶':'🏠',3.2,true);
  if(res.food<pop&&rnd()<.6)return say(v,'🍎',3.2,true);
  if(R.want==='wood'&&rnd()<.5)return say(v,R.trees<10?'🌳':'🪵',3.2,true);
  if(R.want==='room'&&rnd()<.3)return say(v,'🏠',3.2,true);
  if(R.dry&&rnd()<.3)return say(v,'💧',3.2,true);
  if(pop>=10&&!R.hasShrine&&rnd()<.2)return say(v,'⛩️',3.2,true);
  if(v.happy>.7&&rnd()<.4){const e=pick(['❤️','😊','🎵','🙏','🌸']);return say(v,e,2.4,e==='🙏');}
}
function moveToward(v,tx,ty,sp,dt){
  const dx=tx-v.x,dy=ty-v.y,d=Math.hypot(dx,dy),st=sp*dt;
  if(d<=st){v.x=tx;v.y=ty;return true;}
  v.x+=dx/d*st;v.y+=dy/d*st;v.ang=Math.atan2(dx,dy);if(Math.abs(dx)>.02)v.dir=dx>0?1:-1;v.walk+=st*9;return false;
}
function die(v,why){
  clearTask(v);const i=tileOf(v);
  if(walk[i]&&!G.bld[i]&&!G.obj[i]){G.obj[i]=O_GRAVE;G.grow[i]=1;}
  G.villagers.splice(G.villagers.indexOf(v),1);G.stats.deaths++;
  toast(why==='age'?'🕊️':'💀 🍎');
  if(R.sel&&R.sel.v===v)select(null);
}
function updV(v,dt){
  v.age+=dt/DAY;v.hunger-=dt/(1.25*DAY);
  if(v.hunger<=0){v.hunger=0;v.health-=dt/(1.6*DAY);if(v.health<=0)return die(v,'hunger');}
  else if(v.health<1)v.health=Math.min(1,v.health+dt/DAY);
  if(v.bub){v.bub.t-=dt;if(v.bub.t<=0)v.bub=null;}
  if(v.look>0)v.look-=dt;if(v.awe>0)v.awe-=dt;
  const ti=tileOf(v);
  if(!v.asleep){v.sayT-=dt;if(v.sayT<=0){v.sayT=9+rnd()*16;pickSay(v);}}
  if(!walk[ti]&&!v.inside&&!(v.task&&v.task.kind==='swim')){
    clearTask(v);const g=nearestWalk(ti%W,(ti/W)|0);
    if(g>=0)v.task={kind:'swim',phase:'go',path:[ti],pi:1,t:0,claim:-1,bid:0,gx:g%W+.5,gy:((g/W)|0)+.5};
    return;
  }
  if(v.pause>0){v.pause-=dt;return;}
  const t=v.task;
  if(!t){v.idle-=dt;if(v.idle<=0){if(!think(v))v.idle=.6+rnd()*1.5;}return;}
  if(t.kind==='swim'){if(moveToward(v,t.gx,t.gy,terr(G.h[ti])<2?.9:1.6,dt))v.task=null;return;}
  if(t.phase==='go'){
    if(t.pi>=t.path.length){t.phase='work';t.t=0;return;}
    const ni=t.path[t.pi];if(!walk[ni]){clearTask(v);return;}
    const last=t.pi===t.path.length-1;
    const tx=ni%W+.5+(last?v.jx:v.jx*.5),ty=((ni/W)|0)+.5+(last?v.jy:v.jy*.5);
    const sp=(v.age<ADULT?1.7:2.1)*(v.carry?.85:1)*(v.hunger<.1?.7:1);
    if(moveToward(v,tx,ty,sp,dt))t.pi++;
    if(G.wear[ti]<1)G.wear[ti]=Math.min(1,G.wear[ti]+dt*.04);
    return;
  }
  t.t+=dt;const ci=t.claim;
  switch(t.kind){
    case 'chop':if(G.obj[ci]!==O_TREE)return clearTask(v);
      if(t.t>=4){if(rnd()<.4){G.grow[ci]=.08;}else{G.obj[ci]=0;G.grow[ci]=0;}v.carry={k:'wood',n:3};fxAdd(ci%W+.5,((ci/W)|0)+.5,'puff',4);clearTask(v);}break;
    case 'berry':if(G.obj[ci]!==O_BUSH)return clearTask(v);
      if(t.t>=3){G.grow[ci]=.15;if(t.eat){v.hunger=Math.min(1,v.hunger+.5);}else v.carry={k:'food',n:2};clearTask(v);}break;
    case 'crop':if(G.obj[ci]!==O_CROP)return clearTask(v);
      if(t.t>=2.5){G.grow[ci]=.03;v.carry={k:'food',n:3};clearTask(v);}break;
    case 'mine':if(t.t>=5){if(ci>=0&&G.obj[ci]===O_ROCK){G.grow[ci]-=.34;if(G.grow[ci]<=.02){G.obj[ci]=0;G.grow[ci]=0;}}
      v.carry={k:'stone',n:2};clearTask(v);}break;
    case 'fish':if(t.t>=9){v.carry={k:'food',n:2};clearTask(v);}break;
    case 'eggs':{const b=bById[t.bid];if(!b)return clearTask(v);
      if(t.t>=2){const n=Math.floor(b.eggs);b.eggs-=n;if(n>0)v.carry={k:'food',n};clearTask(v);}break;}
    case 'build':{const b=bById[t.bid];if(!b||b.done)return clearTask(v);
      b.prog+=dt;if(b.prog>=BD[b.type].work){finishBuilding(b);clearTask(v);}break;}
    case 'deliver':G.res[v.carry.k]=Math.min(R.cap,G.res[v.carry.k]+v.carry.n);v.carry=null;clearTask(v);break;
    case 'hunt':{let got=null;for(const a of G.animals)if(a.t==='sheep'&&Math.hypot(a.x-v.x,a.y-v.y)<1.6){got=a;break;}
      if(got){G.animals.splice(G.animals.indexOf(got),1);v.carry={k:'food',n:4};}clearTask(v);break;}
    case 'sleep':v.asleep=true;v.inside=!!t.home&&!!bById[v.home];
      if(!R.sleep){clearTask(v);v.sayT=Math.min(v.sayT,2+rnd()*6);}break;
    case 'pray':G.faith=Math.min(faithCap(),G.faith+dt*.3);if(t.t>=t.dur){v.happy=Math.min(1,v.happy+.1);clearTask(v);}break;
    default:if(t.t>=(t.dur||2))clearTask(v);
  }
}
const faithCap=()=>100+(R.hasShrine?50:0);

/* ================= village planning ================= */
function assignHomes(){
  const houses=G.buildings.filter(b=>b.type==='house'&&b.done);if(!houses.length)return;
  const occ={},ad={};for(const b of houses){occ[b.id]=0;ad[b.id]=0;}
  for(const v of G.villagers){if(v.home&&occ[v.home]===undefined)v.home=0;if(v.home){occ[v.home]++;if(v.age>=ADULT)ad[v.home]++;}}
  for(const v of G.villagers)if(!v.home){
    let best=null,bd=1e9;for(const b of houses)if(occ[b.id]<4){const d=Math.hypot(b.x-v.x,b.y-v.y)-(ad[b.id]===1?8:0);if(d<bd){bd=d;best=b;}}
    if(best){v.home=best.id;occ[best.id]++;if(v.age>=ADULT)ad[best.id]++;}
  }
  for(const dst of houses)if(ad[dst.id]<=1&&occ[dst.id]<=2){
    const src=houses.find(b=>b!==dst&&ad[b.id]>=3);if(!src)continue;
    const mv=G.villagers.find(v=>v.home===src.id&&v.age>=ADULT&&!v.inside);
    if(mv){mv.home=dst.id;ad[src.id]--;occ[src.id]--;ad[dst.id]++;occ[dst.id]++;}
  }
}
function findSpot(type){
  const anchors=G.buildings.filter(b=>b.done||b.type==='house');if(!anchors.length)return null;
  const from=G.villagers.find(v=>walk[tileOf(v)]&&!v.inside);if(!from)return null;
  const d=BD[type];
  for(let tries=0;tries<3;tries++){
    const a=pick(anchors),ax=a.x,ay=a.y;
    for(let r=2;r<=13;r++){
      const c=[];
      for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
        if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;
        const x=ax+dx,y=ay+dy;if(x<2||y<2||x+d.w>W-2||y+d.h>H-2)continue;
        if(canPlace(type,x,y,true)==='')c.push([x,y,G.moist[y*W+x]+rnd()*.5-(terr(G.h[y*W+x])===2?.6:0)]);
      }
      if(!c.length)continue;
      c.sort((p,q)=>q[2]-p[2]);
      for(let k=0;k<Math.min(3,c.length);k++){const g=c[k][1]*W+c[k][0];if(bfs(tileOf(from),i=>i===g))return c[k];}
    }
  }
  return null;
}
function elder(){
  R.want=null;
  const pop=G.villagers.length;if(!pop)return;

  a.w-=dt;

    const hb=a.home&&bById[a.home],ang=rnd()*6.283,d=1+rnd()*2.5;
    let tx=a.x+Math.cos(ang)*d,ty=a.y+Math.sin(ang)*d;
    if(hb&&Math.hypot(tx-hb.x-.5,ty-hb.y-.5)>2.6){tx=hb.x+.5+(rnd()-.5)*3;ty=hb.y+.5+(rnd()-.5)*3;}
    const xi=Math.floor(tx),yi=Math.floor(ty);

  }
}

function slowTick(dt){

      else if(o===O_BUSH){if(grow[i]<1)grow[i]=Math.min(1,grow[i]+dt/(1.3*DAY)*mult);}

const terrC=document.createElement('canvas');terrC.width=W*TX;terrC.height=H*TX;const tctx=terrC.getContext('2d');

    b.innerHTML=`<span class="e">${d.e}</span><small>${costStr(d.cost)}</small>`;b.onclick=()=>{buildType=k;syncUI();};bb.appendChild(b);}
}
function setTool(t){tool=t;if(t==='build'&&!buildType)buildType='house';R.ghost=null;syncUI();}
function syncUI(){
  for(const b of $('toolbar').children)b.classList.toggle('on',b.dataset.t===tool);
  $('buildbar').hidden=tool!=='build';
  for(const b of $('buildbar').children){b.classList.toggle('on',b.dataset.b===buildType);b.classList.toggle('cant',!canAfford(b.dataset.b));}
  $('bSpeed').textContent=['⏸','▶','▶▶','','▶▶▶'][G.speed];
}
function updHUD(){
  const f=G.time%1,r=G.res;let beds=0;for(const b of G.buildings)if(b.type==='house'&&b.done)beds+=4;
  $('pDay').textContent=(f<.22||f>.87?'🌙':f<.3?'🌅':f>.78?'🌇':'☀️')+' '+(Math.floor(G.time)+1);
  $('pPop').textContent='👥 '+G.villagers.length+'  🛏️ '+beds;
  $('pWood').textContent='🪵 '+Math.floor(r.wood);$('pFood').textContent='🍎 '+Math.floor(r.food);$('pStone').textContent='🪨 '+Math.floor(r.stone);
  $('pFaith').textContent='✨ '+Math.floor(G.faith);
  $('pFood').classList.toggle('low',r.food<G.villagers.length);
  if(tool==='build')for(const b of $('buildbar').children)b.classList.toggle('cant',!canAfford(b.dataset.b));
  if(R.sel)showInfo();
}
const STATUS={chop:'🪓',berry:'🍓',crop:'🌾',mine:'⛏️',fish:'🎣',eggs:'🥚',build:'🔨',deliver:'📦',hunt:'🏹',sleep:'😴',pray:'🙏',social:'💬',wander:'🚶',eat:'🍽️',swim:'🏊'};
const CARRY={wood:'🪵',food:'🍎',stone:'🪨'};
const bar=(v,cl)=>`<span class="bar"><i style="width:${Math.round(clamp(v,0,1)*100)}%;${cl?'background:'+cl:''}"></i></span>`;
function select(s){R.sel=s;R.demo=false;if(!s)$('info').hidden=true;else showInfo();}
function showInfo(){
  const s=R.sel,el=$('info');let h='';
  if(s.v){const v=s.v;if(G.villagers.indexOf(v)<0)return select(null);
    h=`<span class="big">${v.age<ADULT?'🧒':v.age>v.life*.75?'🧓':'🧑'}</span><span class="big">${v.task?STATUS[v.task.kind]||'💭':'💭'}</span>`+
      (v.carry?`<span>${CARRY[v.carry.k]}<span class="num">${v.carry.n}</span></span>`:'')+
      `<span>🍎 ${bar(v.hunger,v.hunger<.3?'var(--bad)':'')}</span><span>${v.happy>.6?'😊':v.happy>.35?'😐':'😟'} ${bar(v.happy,'var(--accent)')}</span>`+
      `<span>⏳ ${bar(v.age/v.life,'#9fb4c4')}</span><span>🏠${v.home&&bById[v.home]?'✅':'❌'}</span>`;
  }else if(s.b){const b=s.b;if(!bById[b.id])return select(null);const d=BD[b.type];
    h=`<span class="big">${d.e}</span>`;
    if(!b.done)h+=`<span>🔨 ${bar(b.prog/d.work,'var(--accent)')}</span>`;
    else if(b.type==='house'){const n=occupants(b.id);h+=`<span>${'🧑'.repeat(n)}${'🛏️'.repeat(4-n)}</span>`;}
    else if(b.type==='coop')h+=`<span>🥚<span class="num">${Math.floor(b.eggs)}</span></span>`;
    else if(b.type==='well')h+='<span>💧🌱</span>';else if(b.type==='store')h+='<span>📦➕</span>';
    else if(b.type==='shrine')h+='<span>🙏✨</span>';else if(b.type==='hut')h+='<span>🐟🍎</span>';else if(b.type==='farm')h+='<span>💧🌾🍎</span>';
    h+=`<button class="act" id="iDemo" aria-label="Demolish">${R.demo?'🗑️❓':'🗑️'}</button>`;
  }else if(s.a){h=`<span class="big">${s.a.t==='sheep'?'🐑':'🐔'}</span><span>${s.a.t==='sheep'?'🌿':'🥚'}</span>`;}
  else{const i=s.i,o=G.obj[i],t=terr(G.h[i]);
    h=`<span class="big">${['🌊','🌊','🏖️','🌿','⛰️','🏔️'][t]}</span>`+(o?`<span class="big">${['','🌳','🍓','🪨','🌼','🌾','🪦'][o]}</span>`:'');
    if(t>=2&&t<=4)h+=`<span>💧 ${bar(G.moist[i],'#5fb0e0')}</span>`;
    if(o===O_TREE||o===O_BUSH||o===O_CROP)h+=`<span>🌱 ${bar(G.grow[i])}</span>`;
  }
  el.innerHTML=h+'<button class="x" id="iX" aria-label="Close">✖</button>';el.hidden=false;
  $('iX').onclick=()=>select(null);
  const dm=$('iDemo');if(dm)dm.onclick=()=>{if(!R.demo){R.demo=true;showInfo();}else{const b=R.sel.b;select(null);removeBuilding(b,true);toast('💥 ♻️');}};
}
/* ---- title screen ---- */
function titleUI(){
  $('tPlay').hidden=false;$('tNew').hidden=preview;$('tRoll').hidden=!preview;$('tBack').hidden=!(preview&&savedExists);
}
function toTitle(){if(mode==='play')save();savedExists=true;preview=false;mode='title';select(null);document.body.classList.add('title');titleUI();}
function rollIsland(){newGame(0);resize();clampCam();preview=true;titleUI();const r=$('tRoll');r.classList.remove('spin');void r.offsetWidth;r.classList.add('spin');}
function startPlay(){
  mode='play';preview=false;savedExists=true;trans=1.6;tool='hand';
  view.yaw=((view.yaw+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;
  document.body.classList.remove('title');syncUI();updHUD();save();
}
function initUI(){
  buildUI();
  $('bMenu').onclick=toTitle;
  $('tPlay').onclick=startPlay;$('tNew').onclick=rollIsland;$('tRoll').onclick=rollIsland;
  $('tBack').onclick=()=>{if(load()){resize();clampCam();preview=false;titleUI();}};
  $('bSpeed').onclick=()=>{G.speed=G.speed===1?2:G.speed===2?4:G.speed===4?0:1;syncUI();};
  const P=new Map();let g=null;
  const brush=()=>tool==='raise'||tool==='lower'||tool==='grow'||tool==='clear'||tool==='rain';
  function stroke(x,y,first){
    const hit=pickGround(x,y);if(!hit)return;const wx=hit[0],wy=hit[1];R.ghost={x:wx,y:wy};
    const tx=Math.floor(wx),ty=Math.floor(wy);if(tx<0||ty<0||tx>=W||ty>=H)return;const i=ty*W+tx;
    if(tool==='raise'||tool==='lower'){const t=performance.now();if(first||t-g.last>55){g.last=t;sculpt(wx,wy,tool==='raise'?1:-1);}}
    else if(tool==='grow'){if(i!==g.lastI){g.lastI=i;growAt(i);}}
    else if(tool==='clear'){if(i!==g.lastI){g.lastI=i;clearAt(i);}}
    else if(tool==='rain'&&first){if(spend(15)){makeRain(wx,wy);awe(wx,wy,6,'😮');}}
  }
  function tap(x,y){
    const hit=pickGround(x,y);
    if(tool==='build'&&buildType){
      if(!hit)return;const d=BD[buildType],gx=Math.floor(hit[0]-d.w/2+.5),gy2=Math.floor(hit[1]-d.h/2+.5),err=canPlace(buildType,gx,gy2);
      if(err)return toast(err);
      if(!canAfford(buildType)){const nw=G.res.wood<(d.cost.wood||0);flash(nw?'pWood':'pStone');return toast((nw?'🪵':'🪨')+' ❌');}
      placeBuilding(buildType,gx,gy2);fxAdd(gx+d.w/2,gy2+d.h/2,'spark',6);awe(gx+d.w/2,gy2+d.h/2,6,'🙏');return;
    }
    let best=null,bd=34;
    for(const v of G.villagers){if(v.inside)continue;const p=project(v.x,gy(v.x,v.y)+.35,v.y);if(!p)continue;const dd=Math.hypot(p[0]-x,p[1]-y);if(dd<bd){bd=dd;best=v;}}
    if(best){if(!best.asleep)say(best,'👋',2,true);return select({v:best});}
    for(const a of G.animals){const p=project(a.x,gy(a.x,a.y)+.2,a.y);if(p&&Math.hypot(p[0]-x,p[1]-y)<26)return select({a});}
    for(const b of G.buildings){if(b.type==='farm')continue;const d=BD[b.type],p=project(b.x+d.w/2,gy(b.x+d.w/2,b.y+d.h/2)+.6,b.y+d.h/2);
      if(p&&Math.hypot(p[0]-x,p[1]-y)<ch/(2*TANH*p[2])*d.w*.6)return select({b});}
    if(!hit)return select(null);
    const tx=Math.floor(hit[0]),ty=Math.floor(hit[1]);if(tx<0||ty<0||tx>=W||ty>=H)return select(null);
    const i=ty*W+tx;if(G.bld[i]&&bById[G.bld[i]])return select({b:bById[G.bld[i]]});
    select({i});
  }
  function panBy(x0,y0,x1,y1){const a=pickPlane(x0,y0),b=pickPlane(x1,y1);if(a&&b){G.cam.x+=a[0]-b[0];G.cam.y+=a[1]-b[1];applyCam();}}
  function zoomAt(x,y,k){const a=pickPlane(x,y);G.cam.d*=k;applyCam();const b=pickPlane(x,y);if(a&&b){G.cam.x+=a[0]-b[0];G.cam.y+=a[1]-b[1];applyCam();}}
  cv.addEventListener('pointerdown',e=>{
    if(mode!=='play')return;
    cv.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(P.size===1){
      const pan=e.button===1||e.button===2||!brush();
      g={sx:e.clientX,sy:e.clientY,t:performance.now(),moved:false,pan,multi:false,last:0,lastI:-1};
      if(!pan)stroke(e.clientX,e.clientY,true);
    }else if(P.size===2&&g){const a=[...P.values()];g.multi=true;g.pan=true;g.pd=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);g.mx=(a[0].x+a[1].x)/2;g.my=(a[0].y+a[1].y)/2;}
  });
  cv.addEventListener('pointermove',e=>{
    if(mode!=='play')return;
    const p=P.get(e.pointerId);
    if(!p){if(e.pointerType==='mouse'&&tool!=='hand'){const h=pickGround(e.clientX,e.clientY);R.ghost=h?{x:h[0],y:h[1]}:null;}return;}
    const px=p.x,py=p.y;p.x=e.clientX;p.y=e.clientY;if(!g)return;
    if(P.size>=2){const a=[...P.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),mx=(a[0].x+a[1].x)/2,my=(a[0].y+a[1].y)/2;
      panBy(g.mx,g.my,mx,my);zoomAt(mx,my,(g.pd||d)/Math.max(d,1));g.pd=d;g.mx=mx;g.my=my;return;}
    if(Math.hypot(e.clientX-g.sx,e.clientY-g.sy)>7)g.moved=true;
    if(g.pan){if(g.moved&&!g.multi)panBy(px,py,e.clientX,e.clientY);}
    else if(!g.multi)stroke(e.clientX,e.clientY,false);
  });
  const up=e=>{
    if(!P.has(e.pointerId))return;P.delete(e.pointerId);
    if(P.size===0&&g){if(g.pan&&!g.moved&&!g.multi&&performance.now()-g.t<450&&e.type==='pointerup'&&e.button===0)tap(e.clientX,e.clientY);
      if(e.pointerType!=='mouse')R.ghost=null;g=null;}
  };
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  cv.addEventListener('contextmenu',e=>e.preventDefault());
  cv.addEventListener('wheel',e=>{e.preventDefault();if(mode==='play')zoomAt(e.clientX,e.clientY,Math.exp(e.deltaY*.0015));},{passive:false});
  addEventListener('keydown',e=>{if(mode!=='play'){if(e.key==='Enter')startPlay();return;}KEYS[e.key]=1;const n=parseInt(e.key,10);if(n>=1&&n<=TOOLS.length)setTool(TOOLS[n-1].id);
    if(e.key===' '){G.speed=G.speed?0:1;syncUI();}if(e.key==='Escape'){setTool('hand');select(null);}});
  addEventListener('keyup',e=>{KEYS[e.key]=0;});
  addEventListener('resize',()=>{resize();applyCam();});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play')save();});
  addEventListener('pagehide',()=>{if(mode==='play')save();});
  document.addEventListener('gesturestart',e=>e.preventDefault());
}
const KEYS={};

/* ================= main loop ================= */
let lastT=0,hudT=0,saveT=0;
function frame(t){
  requestAnimationFrame(frame);
  const real=Math.min(.1,(t-lastT)/1000||0);lastT=t;now=t/1000;
  if(mode==='play'){
    const k=KEYS,sp=G.cam.d*.9*real;if(k.ArrowLeft||k.a)G.cam.x-=sp;if(k.ArrowRight||k.d)G.cam.x+=sp;if(k.ArrowUp||k.w)G.cam.y-=sp;if(k.ArrowDown||k.s)G.cam.y+=sp;clampCam();
    let dt=real*G.speed;while(dt>0){const s=Math.min(dt,.1);step(s);dt-=s;}
    if(trans>0){trans-=real;const q=1-Math.exp(-real*4.5);view.x=lerp(view.x,G.cam.x,q);view.z=lerp(view.z,G.cam.y,q);view.d=lerp(view.d,G.cam.d,q);view.yaw=lerp(view.yaw,0,q);view.pitch=lerp(view.pitch,PITCH,q);}
    else{view.x=G.cam.x;view.z=G.cam.y;view.d=G.cam.d;view.yaw=0;view.pitch=PITCH;}
    hudT-=real;if(hudT<=0){hudT=.25;updHUD();}
    saveT+=real;if(saveT>12){saveT=0;save();}
  }else{
    const q=1-Math.exp(-real*2.5);view.x=lerp(view.x,W/2,q);view.z=lerp(view.z,H/2,q);view.d=lerp(view.d,dMax()*.62,q);view.pitch=lerp(view.pitch,.5,q);view.yaw+=real*.16;
  }
  camBasis();render(real);
}
function boot(){
  if(!gl){document.body.classList.remove('title');document.body.innerHTML='<div style="position:fixed;inset:0;display:grid;place-items:center;font-size:64px">🚫🖥️</div>';return;}
  initGL();resize();
  savedExists=load();if(!savedExists){newGame(0);preview=true;}
  resize();clampCam();initUI();syncUI();titleUI();
  window.KV={get G(){return G;},get R(){return R;},step,save,newGame,sim(days){const n=Math.round(days*DAY/.1);for(let i=0;i<n;i++)step(.1);}};
  requestAnimationFrame(frame);
}
boot();
</script>
